; ===========================================================================
; MGS1 VR MOD -- head tracking + head-relative movement + positional 6DOF
; ===========================================================================
; Settled by experiment (NOT by the community table's labels, which are
; transposed):
;   mgsi.exe+593FC8 = PITCH  (vertical)   -- rotate2.vx
;   mgsi.exe+593FCA = YAW    (horizontal) -- rotate2.vy
;   mgsi.exe+593FCC = ROLL                -- rotate2.vz
;   mgsi.exe+593FA0/A2/A4 = camera X / Y / Z
;
; NOTE: the invert_* keys have been RENAMED. They now apply to the HEAD axes
; before routing, so the names finally mean what they say. If you have an
; older ini, invert_yaw/invert_pitch are ignored -- use the new names below.
; ===========================================================================

[overlay]
enabled=1

[openxr]

; ============================================================================
; VIEW MODE -- R3 DOUBLE-PRESS SWITCHES BETWEEN NATIVE AND VR
; ============================================================================
; Two states, and the mod obeys whichever you picked:
;
;   VR      head-driven camera, 6DOF leaning, alternate-eye stereo, wide FOV,
;           aim laser. Everything the mod does.
;
;   NATIVE  MGS1 exactly as it shipped. The mod writes NOTHING to the game --
;           no camera, no field of view, no player heading -- and shows the
;           picture on a virtual screen that stays put in the room when you
;           turn your head.
;
; R3 double-press switches. R3 HELD (about 0.7 s) recentres: in native mode it
; fetches the screen back in front of you, in VR mode it makes wherever you are
; looking be forward.
;
; The mode is the mod's own and it survives everything the game does. Before
; 2026-08-23 there was no mode -- the mod rode on MGS1's first-person flag,
; which the game revokes on every cutscene, codec call, vent and room change,
; and it tried to guess whether you still wanted it back.
;
; start_in_vr_mode lives in [camera_hook] with the rest of the camera state.

; --- native mode's virtual screen -------------------------------------------
; Set 0 to make native mode use the ordinary head-locked projection layer
; instead of a world-locked quad. Worth trying if native mode shows nothing at
; all: it is the one part of this that depends on the runtime accepting a frame
; whose only layer is a quad. (If that happens in the headset, just
; double-press R3 to go back to VR mode -- the picture returns immediately.)
native_screen_enabled=1

; PC-PORT MENUS (pause / LOAD GAME / SAVE GAME / options), 2026-09-23.
; These are drawn straight onto the game's primary surface with Windows GDI,
; not rendered like the rest of the game, so the headset never saw them. They
; are now captured (see [capture] menu_capture). While one is open it is shown
; on the same world-locked virtual screen native mode uses, placed in front of
; you when the menu opens -- menu text spread across a full 106-degree view is
; unreadable at the edges. 0 = show it head-locked across the view instead.
menu_as_screen=1

; CODEC on the virtual screen (2026-10-03). In VR mode, opening the codec (or
; answering a call) puts the picture on the world-locked virtual screen in
; front of you; closing it returns to the VR view on the same frame.
; 0 = leave the codec in the VR view.
codec_as_screen=1
; Keep the screen this many ms after the codec closes (0 = instant).
codec_exit_hold_ms=0

; Before the first game frame arrives each eye used to be cleared RED (left) /
; GREEN (right) -- a "capture is not working" diagnostic. It is still written to
; the debug log either way ("no game frame yet, showing the black fallback").
; 1 = bring the coloured flashes back.
fallback_debug_colors=0

; Image sharpening (0-100, 0 = off). The game frame is 640x480 (or 1024x768 if
; you pick that in the game's GRAPHICS OPTIONS) stretched across each eye, so
; it looks soft; this restores edge contrast without halos. 30-60 is a good
; range. For the clearest picture ALSO set, in the game's options menu:
;   Graphics resolution = 1024x768, High resolution textures = ON.
sharpen_percent=25

; ---- FRAME PACING (NEW 2026-10-04) -----------------------------------------
; The game makes ~30 images a second, the headset shows 90. Each image should
; stay up for the SAME number of headset frames (3 at 90 Hz). Without pacing,
; an image arriving a hair late was shown for 2 frames and the next for 4 --
; that uneven rhythm is the judder on guards, walking and anything moving.
; 2 = refresh-count lock (NEW, round 3): every image is shown for the same
;     number of headset frames (3 at 90 Hz). Adds about one headset frame
;     (~11 ms) of delay to the game picture only; turning your head is not
;     delayed. The most even rhythm.
; 1 = timing-based version (round 1): less delay, ~75% of images even.
; 0 = show each image the instant it exists (the old behaviour), for an A/B.
; PACE lines in mgs1_vr_debug.log every 5 s print how many headset frames each
; image stayed up for -- with it on you want nearly all of them in the "3:" slot.
; Tip: at 72 Hz no rhythm can be even for a 30 fps game (2.4 frames each);
; 90 Hz in Virtual Desktop is the right refresh for gameplay.
frame_pacing=2
; (mode 1 only) Extra delay allowed for late images, in ms. -1 = automatic (from measured
; arrival jitter, usually 2-6 ms). Raise only if PACE shows many 2/4 entries.
frame_pacing_margin_ms=-1

; ---- EDGE SMOOTHING (NEW 2026-10-04) ---------------------------------------
; FXAA-style anti-aliasing applied when the game image is scaled into each
; eye: jagged polygon edges get smoothed. 0 = off, 100 = full. Purely a
; picture filter -- nothing in the game changes. It does not stop distant
; textures crawling; for that, anisotropic filtering in dxcfg.ini helps more.
post_aa_percent=100

; Distance from you, in centimetres. 250 = two and a half metres.
native_screen_distance_cm=250

; Width in centimetres; the height follows the game's 4:3 aspect. 320 wide at
; 250 away subtends about 65 degrees, which is a very large TV from a sofa.
; Want it bigger? Raise this, or lower the distance -- only the RATIO changes
; how big it looks. Moving it further away and scaling up together keeps the
; apparent size but makes your eyes focus further out, which some people find
; more comfortable for long sessions.
native_screen_width_cm=320

; 1 = the screen always stands upright at eye height, and only WHICH WAY it
; faces depends on where you were looking when it was placed. 0 = it takes your
; full head orientation, tilt and all -- for playing lying down.
native_screen_lock_roll=1

runtime_json=
enable_session=1
hmd_look_enabled=1
force_fpv_on_start=0

; In-frame camera hooks. Leave on -- this is why head tracking works.
use_camera_write_hook=1

; Obsolete NOP patches. Leave off.
enable_camera_nop_patches=0

; Legacy cross-thread path -- ignored while use_camera_write_hook=1.
enable_real_camera_write=1
use_incremental_camera_write=1
max_camera_step_per_frame=40

hmd_look_sensitivity_yaw=900
hmd_look_sensitivity_pitch=900

; --- Image framing (fixes a real distortion) --------------------------------
; The game renders 4:3 (640x480, aspect 1.333). The per-eye swapchain is
; 2496x2688 (aspect 0.928). Until now the frame was STRETCHED from one to the
; other, making everything 44% too tall across your whole field of view. That
; is very likely a large part of why the picture felt looming and close.
;
; 1 = fit the frame correctly and letterbox the surround (what you want).
; 0 = the old stretched behaviour, for comparison.
preserve_aspect=1

; Shrink the picture inside the eye, as a percentage of the largest
; aspect-correct fit. 100 = fill as much as possible.
;
; THIS IS THE "PUSH IT BACK" KNOB. If menus and codec calls still feel like
; they are pressed against your face, drop this to 85, then 75. Lower values
; give you a smaller virtual screen with black surround, which is much more
; comfortable for reading. Ini-only -- no rebuild needed to retune it.
; Range 20-100.
;
; FIXED 2026-08-16: this key used to do nothing at all whenever
; submitted_hfov_deg was non-zero. Shrinking the drawn rectangle also narrows
; the layer's sub-image to that rectangle, and the FOV claim was built from
; the rectangle's ASPECT -- which scaling preserves -- so the picture kept
; subtending exactly the same angle however small the rect got. The claim is
; now scaled by the same factor, which is what actually moves the image away
; from you. If you had tuned this knob against submitted_hfov_deg=0 and later
; switch that on, expect it to start having a visible effect it did not have
; before.
image_scale_percent=100

; --- CROP-TO-FILL: removing the letterbox bars (NEW 2026-08-16) -------------
; Short-term goal, now shipped. preserve_aspect=1 fits the game's 4:3 frame
; INSIDE the eye buffer, which is correct and which is why there are black
; bands. This crops instead of fitting, so the picture reaches the edges.
;
; READ THE TRADE BEFORE TURNING IT UP. The Quest 2's per-eye buffer is TALLER
; than it is wide (2496x2688 = aspect 0.929) while the game's frame is WIDER
; than tall (1.333). So the bars are above and below, and filling them means
; scaling the picture up until it is tall enough -- which pushes the left and
; right edges off screen. At 100 the visible horizontal fraction is
; 0.929/1.333 = 0.696: you lose THIRTY PERCENT of your horizontal view.
;
; What that costs in degrees, at various fov_clip_distance values:
;
;   clip  rendered hfov   at crop 0    at crop 50    at crop 100
;   320       53.1 deg      53.1          46.5           38.0
;   240       67.4 deg      67.4          59.3           49.0
;   200       77.3 deg      77.3          68.5           57.0
;   160       90.0 deg      90.0          80.6           68.0
;
; So at the stock FOV this is a bad deal -- you would remove the bars and end
; up with LESS usable view than the letterbox had. At the 240 this file ships
; it is roughly break-even, and it only becomes clearly worth it once
; fov_clip_distance is pushed to 200 or 160. That is exactly why the handoff
; listed this goal as blocked on the FOV work.
;
; Suggested order: try 100 first to see what full bleed feels like, then come
; back to 40-60 if you want most of the bars gone without giving up the sides,
; and lower fov_clip_distance before raising this any further.
;
; 0 = today's behaviour (letterboxed, nothing cropped). 100 = full bleed.
; The startup log prints the resulting effective horizontal FOV, and the
; per-frame "Image framing:" line prints the exact visible fraction, so this
; can be tuned against numbers rather than by feel.
;
; NOTE: the FOV claim (submitted_hfov_deg) is crop-aware -- it narrows by the
; same fraction automatically, so cropping cannot silently reintroduce the
; "world shears as you turn" error. Nothing to keep in sync by hand.
;
; NOTE 2: [hud_magnify] regions are measured against the FULL source frame,
; not the cropped one. That is deliberate: crop-to-fill cuts off the sides,
; which is where MGS1 puts the radar and the life gauge, so a magnify region
; is how you bring a HUD element back after cropping it away.
crop_to_fill_percent=0

; --- PUSHING MENUS, CODEC AND 2D UI FURTHER BACK (NEW 2026-08-16) -----------
; Short-term goal, now shipped. Gameplay is a world you are inside; a codec
; call is a flat picture with small text on it. They want different framing,
; and until now both got image_scale_percent.
;
; While first person is NOT active -- menus, codec calls, cutscenes, the
; briefing screens -- the framing switches to the two keys below instead. A
; smaller scale is literally a smaller virtual screen with black around it,
; which is what makes text comfortable to read in a headset.
;
; The third-person VR diorama mode (see [camera_hook] third_person_vr) is
; explicitly NOT treated as UI -- it is gameplay in a room, and shrinking it
; would defeat the point.
;
; 1 = on, 0 = everything uses image_scale_percent as before.
ui_framing_enabled=1

; The image_scale_percent equivalent for menus/codec/cutscenes. Lower =
; smaller, further-away virtual screen = easier to read. 80 is a deliberate
; first guess, not a measured value: drop to 70 or 65 if codec text is still
; uncomfortable, raise toward 100 if it now feels too far away.
ui_image_scale_percent=80

; Crop-to-fill for UI frames. Kept at 0 on purpose -- cropping the sides off
; a menu can cut off the menu. Only raise this if you have confirmed the
; menus you care about do not use the outer edges of the screen.
ui_crop_to_fill_percent=0

; How many captured frames to blend across when switching between gameplay
; and UI framing. MGS1 cuts to a codec call instantly, and an instant change
; of image SIZE in a headset reads as the world lurching toward or away from
; you. 8 frames is about a quarter of a second at the game's 30 fps. Set to 1
; for an instant switch.
ui_transition_frames=8

; --- FPV AUTO-RESTORE (NEW) -------------------------------------------------
; MGS1 drops you out of first person on its own, constantly: every cutscene,
; every codec call, climbing out of a vent, most room transitions. The first
; headset log recorded seven spontaneous exits in ten minutes, each needing
; another manual R3 double-press.
;
; The mod keeps MGS1's own first-person flag in agreement with the VIEW MODE
; you chose with R3. It is no longer a guess and no longer has a retry budget.
;
; MGS1 revokes first person constantly -- every cutscene, codec call, vent and
; most room transitions. Until 2026-08-23 the mod tried to infer whether you
; still wanted it back and gave up after three attempts. The 2026-08-23 log
; showed why that failed: both "gave up after 3 attempts" events fired all
; three attempts while the camera update was stopped (1504 and 1592 flips),
; i.e. mid-cutscene, when the game could not have accepted a request under any
; circumstances. The budget was spent on moments that were never candidates,
; and giving up then cleared the intent -- so first person was abandoned
; precisely because the mod had wasted its retries.
;
; Now: a request is only sent when the game could plausibly take one (camera
; update running, no menu, no cutscene). Outside that it simply waits, with no
; limit, because the mode is a decision you made rather than something to be
; inferred.
;
; Armed once first person has been established at least once -- by pressing R3
; or by the game putting you there. Before that the mod stays quiet, so it
; cannot start firing keypresses at the title screen.
fpv_auto_restore=1

; Gap between requests, in milliseconds. No longer a one-shot settle delay:
; nothing is spent while waiting, so this is just how often to knock.
fpv_restore_delay_ms=1200

; OBSOLETE and ignored since 2026-08-23. There is no attempt cap and no
; "deliberate exit" heuristic any more -- R3 says what you want, explicitly.
; Left here only so an old ini does not look like it lost settings.
fpv_user_toggle_grace_ms=2000
fpv_restore_max_retries=3

; --- PER-EYE POSE TAGGING (NEW) ---------------------------------------------
; With alternate-eye stereo one eye is ALWAYS a game frame (~33ms) old. We used
; to submit both eyes claiming the CURRENT head pose, so the compositor had no
; idea one image was stale and reprojected neither -- and the old eye visibly
; dragged a ghost behind the fresh one through every head swing.
;
; Now each eye is tagged with the head pose its own image was actually
; rendered from, and the runtime timewarps the stale one forward for you.
;
; IMPORTANT: this corrects ROTATION only. Timewarp has no depth buffer from us
; and cannot re-parallax a stale image, so ghosting while WALKING is handled
; separately, by stereo_motion_hold_units in [camera_hook]. The two settings
; cover different halves of the problem; neither replaces the other.
;
; 1 = tag each eye properly. 0 = the old behaviour, for a direct A/B.
stereo_pose_tagging=1

; --- WORLD LOCK (NEW 2026-09-22) -- the fix for "choppy when looking around,
; the same view twice with an offset, and the motion controls drifting" ------
; Two things were stopping the world from staying still while you look around,
; and both had to go at once:
;
;  1. THE LABEL. The pose tagging above was applied on the VR thread, every VR
;     frame, using the headset pose of THAT VR frame. So the newest picture was
;     always claimed to be current and was never reprojected: the world rode
;     along with your head between game frames and then snapped -- at 15 Hz
;     per eye, each eye snapping at a different moment. Every frame now carries
;     the exact head pose the game camera was steered from (recorded in the
;     camera hook, attached at flip) and is submitted with that pose, however
;     many VR frames re-show it. Needs frame_view_record=1 in [camera_hook].
;
;  2. THE MAGNIFICATION. The game draws ~67-77 degrees; the legacy claim spread
;     it over the headset's ~87 degree eye, so a 10 degree head turn moved the
;     drawn world ~13 degrees. A magnified picture cannot be held still by any
;     reprojection. Head-driven frames now claim exactly the FOV they were
;     projected with (read from the frame, so it follows fov_clip_distance).
;     Menus, codec and native mode keep the old, bigger presentation.
;
; The picture in first person will look like a large window rather than
; filling your whole view. That is the honest size. fov_clip_distance in
; [camera_hook] now only decides how much of the world is drawn -- lower it
; to fill more of the lens; the scale stays correct at any value.
;
; 1 = claim the frame's real FOV (world-locked). 0 = legacy claim (world swims).
fov_claim_from_frame=1

; While you turn with the STICK, the two eyes' pictures were drawn a frame
; apart with the world rotated between them. 1 = re-label the older eye by
; the turn that has happened since, so both eyes agree. 0 = off, for an A/B.
stereo_stick_turn_correction=1

; --- EYE RESOLUTION ---------------------------------------------------------
; Percentage of the runtime's RECOMMENDED per-eye size to actually submit.
;
; The Quest 2 via VDXR recommends 2496x2688 per eye. Our source image is
; 640x480. Submitting at the recommendation means paying to composite and
; wirelessly encode a 4x linear upscale that carries no extra detail at all.
;
; That waste is not free: it is almost certainly why the compositor had no
; headroom for even ONE extra composition layer, which is what made the aim
; laser collapse the frame rate (confirmed 2026-08-14 with laser_submit_layer).
; 50% linear = a quarter of the pixels, and against a 640x480 source it is
; still roughly a 2x upscale, so there is nothing to lose visually.
;
; Raise to 100 to compare; drop toward 35 if the compositor still looks
; starved. Clamped to 25..100.
;
; TESTED 2026-08-15 at 60: NO visual improvement -- if anything NPCs/objects
; looked blockier. Makes sense in hindsight: this setting only changes the
; SUBMITTED buffer size, not how the 640x480 source gets upscaled into it --
; that upscale used to be a cheap CPU nearest-neighbor resize. Raising this
; just stretched the same blocky source across more pixels, exposing the
; blockiness rather than fixing it. REVERTED to 50 -- no benefit at 60, and
; higher costs more compositor headroom for nothing. The real fix for
; blockiness was the GPU bilinear resample below (now shipped) -- retest
; eye_resolution_percent AFTER confirming that looks right, not before.
eye_resolution_percent=50

; --- GPU BILINEAR RESAMPLE (NEW 2026-08-15, test 3) -------------------------
; Replaces the CPU nearest-neighbor upscale that made NPCs/geometry look
; blocky (confirmed via the eye_resolution_percent=60 test above -- raising
; the destination size just made the same unfiltered source more visible).
;
; The raw 640x480 game frame is now uploaded to a small GPU texture at its
; native size, then drawn into the eye buffer with a linear-filtered
; full-screen quad -- the GPU's texture sampler does proper bilinear
; filtering as part of the draw, instead of the CPU doing ~4.7 million
; unfiltered pixel copies by hand. This is what should actually smooth out
; the PSX-era textures/edges you asked about.
;
; 1 = GPU bilinear (new, default). 0 = old CPU nearest-neighbor, kept as a
; safety fallback in case the shader pipeline fails to come up on some GPU
; (the mod auto-falls-back to this internally too if compilation fails, but
; this lets you force it off for an A/B or to rule out the new path).
gpu_bilinear_resample=1

; --- HUD MAGNIFICATION INSETS (NEW 2026-08-15, short-term goal) -------------
; The HUD (radar, life gauge, weapon/ammo, stance icon) is drawn by the game
; at native 4:3 res along with everything else, then letterboxed into the eye
; buffer the same as the world -- so at typical image_scale_percent settings
; it ends up small and hard to read. This draws a magnified copy of a
; corner of the source frame ON TOP of the normal image, using the exact
; same GPU bilinear pipeline as gpu_bilinear_resample above (so it needs
; gpu_bilinear_resample=1 to do anything -- it has no CPU fallback).
;
; See [hud_magnify] below for the actual region definitions. This is OFF by
; default and ships with NO regions defined: we don't have a reference
; screenshot of MGS1's actual HUD layout to hardcode coordinates from, and a
; wrong guess would just magnify empty background. To set this up:
;   1. Play with hud_magnify enabled=0 (i.e. as normal) and note roughly
;      where on screen the HUD element you want bigger sits, as a fraction
;      of the screen (e.g. "top-left, in the left 20% and top 15%").
;   2. Fill in a region below with those fractions as the "src" rect.
;   3. Pick where you want the magnified copy to appear (also as fractions,
;      but this time of the DRAWN image, so it moves correctly with
;      preserve_aspect / image_scale_percent) as the "dst" rect.
;   4. Set hud_magnify enabled=1, region_count to match, relaunch (this
;      section is NOT part of the L3 live-reload -- it sets up GPU resources
;      once at startup) and look.
[hud_magnify]
enabled=0

; How many region1_src/region1_dst (region2_..., region3_..., ...) pairs
; below to actually read. Keeps a bad key from silently truncating a longer
; list -- only regions up to this count are loaded.
region_count=0

; Each region is "x,y,w,h" -- four comma-separated fractions, 0..1, no
; spaces. src crops that rectangle out of the game's native source frame;
; dst places the magnified result at that rectangle of the drawn image (not
; the whole eye buffer -- this rides on top of the letterbox automatically).
;
; EXAMPLE (commented out -- uncomment and adjust once you've measured where
; your HUD actually sits, then set region_count=1 above):
; region1_src=0.0,0.0,0.22,0.16
; region1_dst=0.02,0.02,0.30,0.22

; --- FOV-EXACT SUBMISSION / WORLD SCALE (NEW) -------------------------------
; The game renders a fixed ~4:3 frustum. We letterbox it into the eye buffer
; and then tell the runtime it fills the headset's whole asymmetric per-eye
; frustum. It does not. That is a pure magnification error and it is a real
; candidate for the world feeling the wrong size -- SEPARATE from
; position_scale, which sets the stereo baseline.
;
; Set this to the game's real horizontal render FOV in degrees and the layer is
; tagged with a symmetric frustum built from exactly that value, with the image
; rect narrowed to the pixels actually drawn.
;
; 0 = off (previous behaviour). MGS1's true FPV FOV is NOT confirmed, so this
; is a tuning knob, not a known value: try 60, then 75, then 90, and watch what
; happens to apparent SIZE. The tell for a bad claim is that yaw warps -- the
; world shears as you turn -- while pitch stays clean.
;
; Do NOT tune this before you have measured position_scale from the Pos[] lines
; in the log. Two unknown scale errors at once cannot be separated by feel.
; THE SHAPE-VS-SIZE TRADEOFF. Read this before changing it.
;
;  0  = legacy. Claim whatever FOV the runtime suggests. The game's image is
;       stretched to fill your whole view. BIGGER, but geometrically WRONG:
;       we render 67 deg of world and display it across ~100 deg of your
;       vision, so everything is subtly widened and distances read short.
; -1  = AUTO. Derive the claim from fov_clip_distance so the layer says
;       exactly what the game drew. GEOMETRICALLY CORRECT -- straight lines
;       and distances behave -- but the image occupies LESS of your view,
;       with empty space around it, because 67 deg is genuinely narrower
;       than the headset.
;  N  = claim N degrees explicitly.
;
; Neither is simply "the fix". -1 is correct; 0 is bigger. Try -1, and if the
; smaller image bothers you more than the distortion did, go back to 0 and
; instead push fov_clip_distance lower (200, then 160) until the honest claim
; fills enough of your view. That path gets you both, and is the real answer.
submitted_hfov_deg=0

[aim]
; ===========================================================================
; THE AIM LASER.
;
; A row of soft dots along the right controller's pointing ray, drawn as
; OpenXR quad layers -- by the compositor, not by the game. That means it is
; correct in both eyes for free, costs the 30fps engine nothing, and nothing
; in MGS1's software rasteriser can clip it or z-fight with it.
;
; Right now this is a CALIBRATION INSTRUMENT more than a feature. There is no
; confirmed bullet-direction address in MGS1 yet, so the flow is:
;
;   1. Stand facing a wall you can put holes in.
;   2. Fire. Note where the holes are versus where the dots point.
;   3. Nudge the trim below until they agree.
;   4. From then on, the dots ARE the aim, and any engine-side aim write can
;      be checked against them instead of against a feeling.
;
; Everything here is ini-only, no rebuild needed to retune.
; ===========================================================================

; 0 disables the whole thing -- no swapchain, no layers, zero cost.
;
; READ THIS BEFORE CHANGING ANYTHING IN THIS SECTION. The first version of the
; laser submitted ONE COMPOSITION LAYER PER DOT. Six alpha-blended quads on
; top of two 2496x2688 projection views saturated the Virtual Desktop
; compositor on a Quest 2, and once it fell behind, the game's DirectDraw
; Lock() blocked on a busy GPU and the process never recovered: 30 fps to
; 3 fps, permanently, surviving even a return to third person. Bisected and
; confirmed on 2026-08-14. The beam is now DRAWN INTO a single quad's texture,
; so the layer count is 1 no matter how many dots you ask for.
laser_enabled=1

; DIAGNOSTIC. 1 = normal. 0 = do every bit of the laser's work (rasterise the
; beam, acquire/wait/release the swapchain, upload the texture) but never hand
; the layer to xrEndFrame. You will see no beam.
;
; This exists because the collapse described above came BACK after the
; six-layers-to-one fix, which means layer count was not the mechanism. The
; only confirmed fact is laser off = clean, laser on = collapse. This switch
; splits the remaining suspects:
;   still collapses -> our swapchain traffic is the cost
;   holds 30 fps    -> the composition layer is the cost, and one is too many
; SETTLED 2026-08-14. The bisection went: submit_layer=0 held the frame rate,
; submit_layer=1 collapsed it -- so the composition LAYER was the cost, not our
; swapchain traffic. Then eye_resolution_percent=50 freed three quarters of the
; compositor's pixels, and submit_layer=1 now holds a flat 30.0 fps.
; It stays at 1. Only drop it to 0 if a frame-rate collapse ever returns and
; you need to re-run that bisection.
laser_submit_layer=1

; How many dots. More reads as a continuous beam; fewer is less visual noise.
; Dots are now CHEAP -- they are pixels in one texture, not layers -- so this
; is purely a taste setting. Still capped at 12 in code to bound the per-frame
; draw loop.
laser_dots=6

; First and last dot, in CENTIMETRES from the controller. The ini API is
; integer-only, hence cm rather than metres.
laser_near_cm=30
laser_far_cm=600

; Dot diameter in TENTHS OF A DEGREE (7 = 0.7 deg). This is an ANGULAR size,
; so the dots stay the same apparent size at every distance and the beam reads
; as an even row rather than shrinking away into the distance. That is what
; makes it usable as a sight.
; RAISED from 7 to 15. The single-quad rewrite rasterises the beam onto a
; 256px canvas spanning 100 deg -- about 2.6 px per degree -- so a 0.7 deg dot
; came out under one pixel across and was effectively invisible in the last
; session. 1.5 deg gives roughly a 4 px dot, which actually reads.
laser_size_tenth_deg=15

; --- TRIM, in tenths of a degree --------------------------------------------
; This is the calibration. Positive yaw moves the beam right, positive pitch
; moves it up (both in the controller's own frame, so it behaves like a sight
; adjustment rather than a world-space rotation).
;
; These are applied BEFORE the direction is published, so the laser and any
; future engine aim write describe one single ray by construction -- they
; cannot drift apart, because there is only one number.
aim_yaw_trim_tenth_deg=0
aim_pitch_trim_tenth_deg=0

[capture]
; WHICH HEAD POSE / EYE A CAPTURED FRAME BELONGS TO (added 2026-09-24).
; The game presents at the START of a frame, before drawing that frame, so the
; picture a present shows was drawn one frame EARLIER than the head pose and
; eye tag the mod used to attach to it. 1 = attach the tag from the frame the
; pixels were actually drawn in (correct; steadier world lock outside render
; twice, and the right eye for alternate-eye stereo). 0 = legacy behaviour.
tag_delay_frames=1
; ===========================================================================
; FRAME CAPTURE COST -- this is the menu / codec / cutscene / underwater fix.
;
; Measured, from the PERF lines in your own log:
;
;   healthy gameplay : game 30.0 fps (33.3 ms) | our capture 4.29 ms (13%)
;                      | lock avg 3.85
;   underwater/menus : game  8.1 fps (123.7 ms) | our capture 108.56 ms (88%)
;                      | lock avg 107.97
;
; Conversion is flat at ~0.5 ms in both. The whole difference is Lock(). The
; game's primary surface lives in video memory, so locking it makes the CPU
; wait for the GPU to finish everything it has queued, then drags the
; framebuffer back across the bus. In heavy scenes that wait IS the frame.
;
; In other words the slow sections were not the game being slow. We were
; making them slow. Two levers below.
; ===========================================================================

; --- Lever 1: don't block ---------------------------------------------------
; 1 = ask for the frame without DDLOCK_WAIT. If the GPU is still drawing, we
;     are told so instantly and simply skip that frame instead of stalling the
;     game. Costs us a capture, costs the game nothing.
; 0 = the old always-blocking behaviour.
;
; Safety net: after lock_nowait_max_busy consecutive "still drawing" replies we
; take one blocking lock anyway, so the headset image can never freeze. And if
; the wrapper turns out not to support non-blocking locks at all, the mod
; notices, says so in the log, and falls back on its own.
lock_nowait=1
lock_nowait_max_busy=4

; --- Lever 2: adaptive throttle ---------------------------------------------
; If locks are still expensive (a wrapper that ignores the flag above), stop
; capturing every frame. Above this rolling average lock cost we capture 1
; frame in N, with N growing the further over budget we are. In a codec call or
; a menu the picture is nearly static, so a lower capture rate is barely
; visible while the game gets its frames back.
;
; This is also the experiment that proves causation: if the game speeds up
; while we capture less, the cost was definitively ours.
; TURNED OFF after the 2026-08-14 bisection. This never solved a real problem
; and twice made one much worse: it reacts to Lock() times, and a long Lock()
; usually means the GPU is busy for reasons that are not us, so it would back
; off to 1-in-7 and starve the headset while the game itself was fine. With
; the laser fixed, locks sit at 2-8 ms and it would never engage anyway.
; --- CAPTURE SOURCE ---------------------------------------------------------
; 0 = auto: DirectDraw primary, falling back to the D3D9 backbuffer only if
;     DirectDraw has nothing. In practice DirectDraw never fails, so the D3D9
;     path is never used in auto mode.
; 1 = force DirectDraw.
; 2 = force the D3D9 backbuffer.
;
; DIAGNOSTIC FOR THE PAUSE MENU. During a pause the game keeps flipping and
; our DirectDraw capture keeps succeeding at 90%+ non-zero pixels -- so the
; old "the menu draws via Blt, so we never capture" theory is disproved. The
; menu is simply not in the pixels DirectDraw gives us. Set this to 2, pause,
; and see whether the menu appears. Expect the eye tag to be absent in this
; mode (the D3D9 path carries no eye tag), so stereo will be mono throughout
; -- that is normal for the test, not a regression.
;
; RESULT 2026-08-14: source=2 SHOWS NOTHING AT ALL. The D3D9 backbuffer path
; never captures a frame -- `D3D9 capture status: hasCapturedFrame=0` in every
; sample, across three runs -- so the headset gets the RED/GREEN "no frame"
; fallback and the game appears to have vanished. It has not; only the image
; path is affected, which is why sound and controls kept working.
;
; That is still a useful answer: the game's image does not reach the D3D9
; backbuffer in any form we can read, so the pause menu is definitively not
; there either. DO NOT set this to 2 again expecting to see anything.
source=0

adaptive_throttle=0

; Milliseconds. Was 8, RAISED TO 20 after the first headset session.
;
; THIS INTERACTS BADLY WITH ALTERNATE-EYE STEREO AND THE OLD VALUE WAS DOING
; REAL DAMAGE. The eye alternates every game frame: L,R,L,R. When the throttle
; backs off to "1 flip in 2" it captures every OTHER frame -- which, against a
; period-2 alternation, means it captures THE SAME EYE FOREVER. One eye stops
; receiving new frames entirely for as long as the throttle is engaged.
;
; The first session's log shows it flapping between 1-in-1 and 1-in-2 roughly
; twice a second against a budget of 8 ms, while the measured average lock cost
; was only 3-5 ms. So the throttle was firing constantly, on noise, and each
; time it did one eye went blind.
;
; 20 ms sits well above the real average and below a genuinely damaging stall,
; so the throttle now only engages when something is actually wrong.
;
; NOTE: 1-in-3 does NOT have this problem (odd counts still alternate). Only
; even skip counts alias. The proper fix is to force the skip count odd while
; stereo is active -- see the handoff doc.
max_lock_ms=20

; Never capture less often than 1 frame in this many.
max_skip=8

; --- PAUSE MENU INVESTIGATION (NEW 2026-08-15) ------------------------------
; The pause menu never appeared in any DirectDraw or D3D9 capture we've taken
; (see the "DIAGNOSTIC FOR THE PAUSE MENU" note above -- source=2 proved the
; D3D9 backbuffer never gets it either). The remaining untested theory is that
; the menu is drawn via IDirectDrawSurface7::Blt/BltFast -- a partial-surface
; blit -- rather than through the full-frame Flip() path our capture already
; hooks. Blt/BltFast are now hooked purely for LOGGING (destination rect,
; source surface pointer, flags) so a play session with the pause menu opened
; and closed a few times tells us definitively whether the menu goes through
; this path at all, and if so, roughly where/what it draws -- turning any
; future capture attempt into a targeted one instead of "log everything".
; This does NOT capture pixels yet, just logs call shape. No CE hunt needed.
;
; How many Blt / BltFast calls to log in full before going quiet, so normal
; per-frame UI compositing (which may call these many times a frame) doesn't
; flood the log forever. 0 disables logging for that call (the hook still
; installs and passes through untouched -- just stops logging).
blt_log_cap=600
bltfast_log_cap=600

; PC-PORT MENU CAPTURE (2026-09-23). Found by disassembly: the pause / LOAD /
; SAVE / options menus (+42D6xx..+438xxx) do Blt(colour fill) + GetDC +
; TextOutA + ReleaseDC directly on the PRIMARY surface, and present nothing
; while open. Capture used to happen only right after Flip, so the headset kept
; the last gameplay frame. Now any GDI draw on the primary captures it.
;   menu_capture          1 = on, 0 = old behaviour (menus only on the monitor)
;   menu_hold_ms          how long after the last menu draw it counts as open
;                         while the game is presenting again
;   menu_min_interval_ms  minimum gap between menu captures in a redraw burst
;                         (the last draw of a burst is always picked up)
; Log lines: "Menu capture hooks:", "Menu overlay: ... caller mgsi.exe+XXXX",
; "Menu capture #N", and "PC menu OPEN / closed".
menu_capture=1
menu_hold_ms=400
menu_min_interval_ms=20
; Stall watchdog: if the game stops presenting for this many ms (and no PC
; menu is up), the log records which window has focus and where the game
; thread is stuck ("STALL:" lines). 0 = off.
stall_watchdog_ms=2000

[camera_hook]

; --- VIEW MODE STARTUP ------------------------------------------------------
; 1 = the mod starts in VR mode, exactly as every build before 2026-08-23 did.
; 0 = it starts in NATIVE mode, so the game looks completely untouched until
;     you double-press R3.
;
; Either way R3 switches at any time. See the VIEW MODE block in [openxr] for
; what each mode actually does.
start_in_vr_mode=1

; --- Rotation ---------------------------------------------------------------
write_yaw=1
write_pitch=1

; Roll: field confirmed at 593FCC, extraction unverified in-game. Try it once
; everything else feels right.
write_roll=0

; Applied to the HEAD axes before routing.
;
; invert_head_yaw  -> HORIZONTAL. Flipped to 0 in this file. It was 1 and
;   left/right read as reversed, so this is simply the other state. My
;   reasoning said 1 should be right; the game says otherwise, and the game
;   wins. If left/right is STILL reversed with this, the problem is not a sign
;   at all and I'll instrument it properly instead of guessing again.
;
; invert_head_pitch -> VERTICAL. Confirmed correct at 1 (you reported up/down
;   working in the last two builds).
invert_head_yaw=0
invert_head_pitch=1
invert_head_roll=0

; Routes head yaw -> 593FCA and head pitch -> 593FC8. Confirmed correct by the
; write_pitch=0 isolation run. Only change this if the axes come out
; transposed again on some other build.
swap_yaw_pitch=1

; --- Additive rotation (fixes the radar observation) ------------------------
; 1 = read the angle the game just wrote THIS frame and add your head delta on
;     top of it.
; 0 = old behaviour: anchor to the angle captured when you entered FPV.
;
; The old behaviour is exactly why the radar cone rotated with the stick but
; your view did not: we pinned 593FCA to a stale value, so every turn the game
; made afterwards was overwritten a frame later. Leave this at 1.
additive_rotation=1

; BODY FOLLOWS HEAD (2026-09-23). In first person the stick walks Snake along
; HIS facing and your head only turns the camera -- so looking left and pushing
; forward walks straight on, and you had to turn with the right stick.
;   0 = off: Snake turns only with the right stick (classic)
;   1 = while moving: push the move stick and Snake walks where you are looking
;       (his body turns to your head; the view itself does not move)
;   2 = always: his facing tracks your head even standing still
; The right stick still turns you in every mode.
body_follows_head=1

; --- FPV flag debounce ------------------------------------------------------
; The game's FPV flag flickers -- your logs show three transitions inside
; ~200ms on every entry, plus spontaneous drops mid-play. Each one used to
; throw away the reference pose and snap the view, which is a large part of
; "rotating feels wonky". A transition now has to survive this many consecutive
; game frames before it counts. Raise to 10-12 if it still feels twitchy;
; lower to 2 if entering FPV feels laggy.
fpv_debounce_frames=6

; --- Positional 6DOF --------------------------------------------------------
; Writes your head's positional offset into the camera position, from a second
; hook at RVA 0xE1B58 -- placed after the game finalises camera position, so
; it survives. Because MGS1 rasterises the scene in software from this camera
; position, this produces REAL geometric parallax: lean past a doorframe and
; you genuinely see what is behind it. Not a reprojection trick.
position_tracking=1

; Game units per metre. STILL A GUESS. Raised from 300, because at 300 a
; realistic 25cm lean moved the camera 75 units, which is very likely below
; the noise floor of a room-scale MGS1 set -- consistent with you seeing
; nothing at all.
;
; THIS IS THE WORLD SCALE KNOB. It sets two things at once: how far the camera
; moves when you lean, AND the stereo baseline (your IPD below is converted
; through it). Baseline error is the dominant "the world feels small" cue --
; too wide a baseline relative to the world reads as a diorama.
;
; STOP GUESSING IT: the Pos[] lines in mgs1_vr_test.log print the game's own
; camera values next to our offset. Walk Snake between two points a known real
; distance apart, read the numbers, and this becomes exact.
; 2026-09-23: 2048 -> 1000. The old "confirmed ~2048" was circular -- it was
; this very number read back out of the Pos[] lines. Measured instead: the
; first-person camera sits at y=1497 over a floor at y=0, and Snake runs at
; ~95 units/frame (2850/s). At 1000 units/metre that is a 1.5 m eye and a
; 2.85 m/s run; at 2048 it was a 73 cm eye and a stroll. MGS1 is millimetres.
; This also sets the stereo baseline (stereo_ipd_mm is converted with it), so
; at 2048 every eye pair was twice as far apart as your own eyes.
position_scale=1000

; Hard clamp per axis, in game units. Stops a wrong scale from throwing the
; camera into the void. Raised to match the new scale.
max_position_offset=2048

; --- Axis directions --------------------------------------------------------
; IMPORTANT: as of this build these are applied in HEAD space, BEFORE the view
; rotation. They used to be applied to the final world-space offset, which
; meant invert_position_x only behaved like "left/right" while you happened to
; be facing along the world X axis -- turn 90 degrees and it quietly became an
; invert of forward/back instead. That is fixed, so each of the three below is
; now an independent, facing-independent knob that means what it says.
;
; That also means you can settle all three yourself, ini-only, no rebuild:
;   invert_position_x -> lean LEFT. Does the view move left? If it moves
;                        right, flip this.
;   invert_position_z -> lean FORWARD (head toward the screen). Does the view
;                        move forward? If it pulls back, flip this.
;   invert_position_y -> stand up / crouch. Does the view rise and fall with
;                        you? If it is upside down, flip this.
;
; x flipped to 1 from your report: you could see round the object, but only by
; leaning the opposite way. y=1 because PSX Y points DOWN.
;
; SOLVED BY MEASUREMENT 2026-08-15 -- READ THIS BEFORE TOUCHING THESE THREE.
;
; The Pos[] lines in mgs1_vr_test.log settled it. Worked example, Pos[219]:
;   Rot[218]: d(yaw=561) base 2048 -> wrote yaw=2609
;   Pos[219]: headRaw(x=0.150 z=-0.019) -> world(x=0.084 z=-0.126)
; camYaw = 2609/4096 * 360 = 229.3 deg. Apply invert x and z (both 1) to get
; dx=-0.150, dz=+0.019, then rotate:
;   rx = dx*cos + dz*sin = 0.0978 - 0.0144 =  0.083   (log says  0.084)
;   rz = -dx*sin + dz*cos = -0.1137 - 0.0124 = -0.126 (log says -0.126)
; Three decimal places. So the rotation itself is CORRECT and is already using
; the camera's ABSOLUTE yaw, not a delta. That was never the problem.
;
; THE PROBLEM IS THESE TWO FLAGS. They are applied in head space, before the
; rotation. Negating BOTH horizontal axes is not two independent flips -- it
; is exactly a 180 degree yaw rotation, stacked on top of a rotation that was
; already right. x=1,z=1 leans you in precisely the wrong direction at EVERY
; heading. That is what the last test actually did.
;
; And the state before it, x=1 z=0, was worse in a subtler way: negating ONE
; horizontal axis is a MIRROR. A mirror looks correct facing one way and gets
; progressively wronger as you turn -- which is exactly the "difficult to
; describe, feels like it's adjusting the head the wrong way a bit" report.
;
; So neither tested state could have been right, and no combination of these
; two flags alone can be: one of them is a mirror, both is a 180.
;
; THIS FILE NOW SHIPS x=0 z=0 -- no inversion, pure rotation. If the XR and
; game horizontal frames share handedness, this is exactly correct.
;
; IF IT IS MIRRORED (correct facing one way, backwards facing the other), the
; frames are opposite-handed, and the fix is NOT a flag here: a handedness
; change requires negating one axis AND reversing the rotation direction
; together. The ini cannot currently express that -- it needs a
; rotate_position_direction option in code. Report "mirrored" and I'll add it.
;
; y is a separate axis and unaffected by any of this. Leave it at 1 (PSX Y
; points DOWN).
;
; --- superseded, kept so nobody repeats it ---
; LEAN A/B, TEST 1 OF 3 -- z FLIPPED TO 1 IN THIS FILE (2026-08-15).
; Symptom being chased: "head rotation when leaning is still a bit off, almost
; feels like it's adjusting the head the wrong way a bit."
;
; The suspicion is a HANDEDNESS REFLECTION, not a wrong sign. x=1 with z=0
; mirrors one horizontal axis and not the other, which is a reflection rather
; than a rotation. A reflection is invisible when you face one way and gets
; progressively wronger as you turn -- which is exactly the "hard to describe,
; feels subtly wrong" quality of the report. x=1,z=1 is the symmetric case and
; is the most likely correct state.
;
; HOW TO TEST (this matters): lean left/right AND forward/back while facing
; TWO DIFFERENT DIRECTIONS in the room. A reflection reads as correct facing
; one way, so a single-heading test proves nothing.
;
; If this is wrong, the next two states, ini-only, no rebuild:
;   2. back to z=0, and set invert_position_x=0
;   3. x=1, z=0, and set position_yaw_offset_deg=180
invert_position_x=0
invert_position_y=1
invert_position_z=0

; Rotate the lean into the direction you are facing, so leaning left is always
; leaning left relative to your view rather than to a fixed world axis.
rotate_position_with_view=1

; Correction if the rotation frame is off. Try 90 / 180 / 270 if leaning goes
; sideways relative to where you expect.
;
; UPDATED 2026-08-15, after the flip=1/offset=0 headset test. Report was:
; leaning to peek makes the camera go BACKWARDS instead of sideways. That is
; the fingerprint of the frame being 180 degrees off, not mirrored -- the
; math for flip=1/offset=0 was independently re-verified against the test log
; and IS what the code documents it as doing (see camera_hook comment below
; and the handoff doc), so this is not a code bug, it's the last untested
; cell in the four-state table. This was ALWAYS the fallback if flip=1/offset=0
; came back reversed. Moved 0 -> 180. This is ini-only, no rebuild needed.
position_yaw_offset_deg=180

; --- HANDEDNESS (NEW 2026-08-15) --------------------------------------------
; REQUIRES A REBUILD to appear. This is the flag that finally makes the lean
; problem decidable, so read the reasoning once.
;
; Measured results, both from Pos[] lines rather than from feel:
;   invert x=0 z=0  (pure rotation)          -> clearly REVERSED
;   invert x=1 z=1  (= pure rotation + 180)  -> not reversed, but still wrong
;
; Those are the only two rigid rotations the old ini could reach: negating
; both horizontal axes IS a 180 degree yaw, and negating one is a mirror. So
; "both rotations are wrong" is not a tuning failure, it is a proof -- the XR
; play space and the game's world axes are OPPOSITE-HANDED, and no rotation
; can convert between them. It needs a reflection.
;
; A reflection is NOT an axis flip on its own. Negating one axis while leaving
; the yaw direction alone is precisely the heading-dependent mirror that gave
; the original "correct facing one way, wrong facing another, hard to
; describe" report. The mirror and the rotation direction must flip TOGETHER.
; That is all this flag does: mirror Z, and run the yaw backwards.
;
; 0 = pure rotation (both states already tested, both wrong)
; 1 = mirrored Z + reversed yaw
;
; THE FULL SPACE IS FOUR STATES AND EXACTLY ONE IS RIGHT. Three are eliminated:
;   flip=0 offset=0    ELIMINATED -- reversed
;   flip=0 offset=180  ELIMINATED -- was the old x=1,z=1
;   flip=1 offset=0    ELIMINATED 2026-08-15 -- tested in the headset. The
;                      math re-checked out against the test log (so the code
;                      is doing exactly what this comment says), but leaning
;                      to peek moved the camera BACKWARDS instead of sideways
;                      -- the signature of a 180-degree frame error, not a
;                      mirror. See position_yaw_offset_deg below.
;   flip=1 offset=180  <-- THIS FILE NOW SHIPS THIS. Last untested cell.
;
; Leave invert_position_x and invert_position_z at 0 while testing this. They
; can only re-introduce a mirror or a 180 on top and put you back in the fog.
position_handedness_flip=1

; --- POSITION FRAME (NEW 2026-09-23) ------------------------------------------
; 2 = lean and the stereo eye offset are laid onto the game camera's OWN
;     right/up/forward, read out of the engine's view-matrix builder. The flags
;     above (invert_position_*, position_handedness_flip, position_yaw_offset_deg)
;     are ignored. This is the fix for near objects and the gun doubling "like
;     crossing your eyes": the old path put the two eyes side by side only when
;     facing one axis, swapped them facing the other, and one-behind-the-other
;     in between.
; 0 = the old flag-driven path, for an A/B.
position_frame=2

; --- Lean diagnostic --------------------------------------------------------
; 0 = normal, driven by your head.
; Non-zero = ignore the head completely and shove the camera left/right by
; this many game units, flipping every 2 seconds. The clamp is bypassed.
;
; Use this ONLY if leaning still does nothing after this build. If the view
; visibly rocks side to side, position writes DO reach the renderer and we
; only need a bigger scale. If it sits perfectly still even at 2000, the
; position hook is not reaching the render path and we need a different
; address -- which is a completely different fix, so this test is worth one
; run to avoid guessing scales forever.
position_test_oscillate=0

; --- REAL STEREO ------------------------------------------------------------
; Until now both eyes got the same picture with a uniform sideways pixel
; shift. That is not stereo. Shifting the whole image moves near and far
; pixels by the same amount, so there is no disparity between them and your
; brain gets no depth at all -- which is exactly what you reported.
;
; This does it properly. MGS1 re-rasterises the entire scene from wherever we
; put the camera; that is why leaning already produces true parallax. So the
; camera is nudged half an IPD left on one game frame and half an IPD right on
; the next, each captured frame is tagged with the eye it came from, and each
; eye holds its own image. Both eyes then see genuinely different viewpoints,
; with correct disparity at every depth, and it costs NO extra rendering.
;
; The trade, stated honestly: the engine is capped at 30 fps, so each eye
; refreshes at 15 Hz and during fast motion your two eyes are looking at
; slightly different moments in time. That difference is the ghost -- see the
; motion hold and stereo_pose_tagging for the two things that manage it.
;
; Only active in first-person view.
;
; TEST 1 RESULT, 2026-08-15: re-run correctly at =0 this time (confirmed by
; the total absence of Hold[] lines in the test log -- that system only fires
; while alternation is active). Result: stereo depth vanished entirely (as
; expected -- that IS what disabling alternation does), for only a "minimal
; but noticeable" smoothness gain. So alternating stereo IS a real, but MINOR,
; contributor to how FPV feels -- not the dominant cause. Not worth trading
; all your depth for a small comfort gain. REVERTED to 1.
;
; Whether the original PSX/PC game itself runs any heavier in FPV
; independent of this is still an open, separate question -- would need the
; "game X fps" PERF figures compared FPV vs third person to answer, not yet
; checked. Low priority given how small this test's effect turned out to be.
; NOTE 2026-09-24: in first person this is now superseded by [render_twice],
; which draws BOTH eyes every frame and switches this off by itself while it
; runs. Leave it at 1 -- it is the fallback wherever render twice is not
; active (third-person VR, cutscene VR), and the motion hold below only
; applies to it.
stereo_alternate_eyes=1

; Your interpupillary distance in millimetres. 64 is the adult average.
; Larger = more pronounced depth but more eye strain; smaller = subtler.
; If depth feels overwhelming, try 50 before giving up on it.
;
; Note this rides on position_scale above -- it is converted to game units
; through it -- so a wrong position_scale makes this knob mean the wrong thing.
; Settle position_scale first.
stereo_ipd_mm=64

; If the scene looks inside-out -- near things appearing far, or a distinctly
; "crossed eyes" feeling -- the eyes are swapped. Flip this.
stereo_swap_eyes=0

; --- Motion hold: ROTATION --------------------------------------------------
; The weakness of alternate-eye stereo is that your two eyes hold frames from
; different moments. Standing still that is invisible. TURNING, the two eyes
; differ by however far the view rotated in 33ms -- far more than an IPD -- and
; your brain reads that as a ghost trailing the other eye rather than depth.
;
; So above this much view rotation per game frame, we stop alternating and give
; both eyes the same newest frame. Depth drops out while you turn, which is not
; noticeable mid-turn, and returns when you settle.
;
; THIS BUILD measures three things where it used to measure one:
;   * your HEAD's angular velocity, which LEADS the game camera -- so the hold
;     now arms on the FIRST frame of a swing instead of the second
;   * the game's own yaw AND PITCH -- vertical swings used to ghost at full
;     strength and never trigger the hold at all
;   * translation, on its own threshold below
;
; Degrees of view rotation per frame. At 30fps, 2 deg/frame = 60 deg/sec.
; LOWER = holds mono more eagerly = less ghosting, less depth while moving.
; HIGHER = keeps stereo through faster turns.
;
; With stereo_pose_tagging=1 you should be able to push this UP (6, then 12)
; and keep stereo through turns, because the runtime is now correcting the
; stale eye for you. That is the whole point of the pose tagging -- find the
; highest value where turns still look clean.
; RAISED from 2 to 8 after the first headset session. With
; stereo_pose_tagging=1 the runtime now timewarps the stale eye forward for
; you, so trading stereo away for every small turn is no longer necessary --
; and at 2 deg/frame the hold was engaging almost constantly, which is why
; depth vanished the moment you moved your head at all.
;
; Tune from here: if turning brings the ghost back, come down (6, then 4). If
; turns stay clean, go up (12) and keep more depth.
; ============================================================================
; FIELD OF VIEW
; ============================================================================
; MGS1 renders at roughly 53 degrees horizontal. In a headset that is a
; letterbox, and it is the single biggest reason the world reads as "small".
;
; On this engine FOV is not an angle -- it is the GTE projection distance,
; `clip_distance`, and the relationship is:
;
;     hfov = 2 * atan(160 / clip_distance)
;
;   320 (stock) -> 53.1 deg      200 -> 77.3 deg
;   240         -> 67.4 deg      160 -> 90.0 deg
;   128         -> 102.7 deg     110 -> 110.9 deg
;
; So LOWER is WIDER, and roughly halving it doubles your horizontal FOV.
;
; The field is at mgsi.exe+594000 -- entry 91 of the community Cheat Engine
; table, labelled "Zoom", sitting in the camera block between the position /
; rotation family and the FPV flag. Whether it really is clip_distance is
; settled by the log line "FOV observed: ... reads N": if N is 320, it is.
;
; CONFIRMED 2026-08-14: the field reads 320. It IS clip_distance.
;
; 0 = OBSERVE ONLY. Read it, log it, never write it.
; Any other value is written every frame while in first person.
;
; THIS FILE SHIPS AT 240 (67.4 deg). That is the deliberate first step -- a
; real widening you will notice, without the renderer being asked to show you
; twice what it was built for. If 240 looks clean in a few different rooms,
; go to 200, then 160. If you see level seams or things popping in at the
; edges, come back up.
;
; TWO WARNINGS:
;  - Widening the FOV on a 1998 renderer shows geometry that was never meant
;    to be on screen: culling seams, unbuilt room edges, sprite pop-in. Test
;    a few different rooms before settling. Try 240 before you try 160.
;  - Whatever you settle on, set submitted_hfov_deg in [openxr] to match, so
;    the layer claims the frustum it is actually rendering. Those are two
;    separate problems and both need doing or the world will be the right
;    width and the wrong shape.
; 2026-09-23: 120 = 106 x 90 deg -- fills the Quest 2 lens edge to edge, no
; black frame. With fov_claim_from_frame=1 this value never changes how big
; things look, only how much of your view the game draws. The cost is
; sharpness: the same 640x480 spread wider (about 6 px/deg vs 8 at 200).
; 145 = 96 x 79 deg, a touch sharper, with a thin dark rim at the very top and
; bottom of the lens. Go up if you see level seams at the edges.
fov_clip_distance=120

; 1 = only drive the FOV while in first person, leaving the third-person
; camera stock. 0 = drive it always. Start at 1: third person is framed
; around a fixed camera and a wide lens there mostly reveals level seams.
fov_first_person_only=1

; ============================================================================
; THIRD-PERSON VR -- the "diorama" mode (NEW 2026-08-16). REQUIRES A REBUILD.
; ============================================================================
; Medium-term goal from the handoff, likelihood 70%. If you dislike first
; person, play MGS1 as a diorama instead: you stand in the room and watch
; Snake, with head tracking giving a genuine 3D view of the scene rather than
; a flat frame on a screen. MGS1 keeps its own scripted per-room camera
; POSITION and framing; we add head rotation, positional 6DOF and real stereo
; on top of it.
;
; This is the "(a) you are the security camera" variant. The free
; over-the-shoulder variant needs Snake's own world position, which nobody has
; a confirmed address for yet -- the same hunt that blocks strafing.
;
; Almost none of this is new code. Head rotation, 6DOF and stereo were all
; already built and simply gated behind "first person only"; this widens that
; gate and adds the three safety pieces the mode needs (below). With
; third_person_vr=0 every one of those gates reduces to exactly its previous
; form, so first person is bit-for-bit unchanged.
;
; SET EXPECTATIONS. Two known risks, neither of them a bug:
;
;  1. rotate2 is an INTERPOLATION TARGET, and outside first person the game
;     pulls against writes to it harder than it does in FPV. The view may feel
;     rubber-banded or fight you. The suspected fix is 0x593FD0 ("Camera
;     control"), which is still an untested Cheat Engine hand-test -- it is
;     not a tuning knob in this file. If the mode feels like it is fighting
;     you, that is what is happening, and that test is what would fix it.
;  2. MGS1 cuts hard between rooms. Every cut is an instant viewpoint
;     teleport, which is unpleasant in VR. Handled as best it can be without
;     engine cooperation (see third_person_cut_units below) but not
;     eliminated.
;
; ALSO: fpv_auto_restore in [openxr] will keep dragging you back into first
; person if you have been there this session. If you want to actually PLAY in
; the diorama view rather than dip into it, set fpv_auto_restore=0.
;
; 1 = on, 0 = off (default). Only ever engages while the game is NOT in first
; person, so the two modes can never both drive the camera in the same frame.
third_person_vr=0

; Head rotation adds to the game's scripted camera angle. 1 = on.
; Setting this to 0 (or the percent below to 0) is a genuinely useful mode on
; its own: positional 6DOF and stereo still run, so the scene gets real depth
; and real parallax while the camera never leaves the framing the game chose.
third_person_rotation=1

; How strongly head rotation moves the camera, as a percentage. MGS1's fixed
; cameras are already deliberately framed, so 1:1 head turning walks the
; framing off the subject; something like 40-60 gives you look-around without
; losing the shot. 100 = 1:1.
third_person_rotation_percent=100

; Positional 6DOF (leaning gives real parallax from the scripted camera
; position). This is the piece that makes it a diorama rather than a photo.
third_person_position=1

; Alternate-eye stereo in the diorama view. Same trade as in first person: the
; game's 30 fps is split between your eyes, so each eye refreshes at 15 Hz.
; Standing still watching a scene is the BEST case for this -- the motion hold
; barely ever fires -- so it is on by default here.
third_person_stereo=1

; Extend the fov_clip_distance write into the diorama view too. Off by
; default, and it is a real judgement call: a diorama seen through a 53 deg
; letterbox is a screen while the same diorama at 90 deg is a room, which
; argues for -- but a wide lens on fixed third-person cameras mostly reveals
; level seams and unbuilt room edges, which argues against. Try it once the
; mode itself is working, not before.
third_person_fov=0

; --- ROOM-CUT GUARD ---------------------------------------------------------
; The one thing that could sink this mode. MGS1 changes camera between rooms
; by teleporting it, and carrying our head-relative offset across that cut
; would start the new room off-axis by however far you had turned in the old
; one, on top of the teleport itself.
;
; A single-frame jump in the game's own camera position larger than this many
; units is treated as a cut: our writes are suppressed for a few frames and
; the head-vs-camera reference is dropped so the view re-anchors cleanly to
; the new camera.
;
; 400 units is about 20 cm at the measured position_scale of ~2048 units per
; metre -- roughly 6 m/s of camera travel, which no scripted pan does and
; every room change exceeds by a wide margin. Lower it if cuts still feel
; jarring; raise it if a fast scripted camera move is being mistaken for a cut
; (the log says "room cut detected" with the measured jump each time, so this
; is checkable rather than guessable). 0 disables cut detection entirely.
third_person_cut_units=400

; How many frames to stay fully stock after a detected cut. ~12 frames is
; about 0.4 s at 30 fps -- long enough for the new room's camera to settle
; before we start adding to it again.
third_person_cut_hold_frames=12

; --- FRAME VIEW RECORD (NEW 2026-09-22) ------------------------------------
; Records, for every game frame, the head pose its camera was steered from, so
; the frame can be submitted to the headset with exactly that pose. This is
; what makes the world lock in [openxr] work. 0 = legacy labelling.
frame_view_record=1

; 2026-09-22: 8 -> 20. Head turns no longer need to fall back to mono: with
; each eye labelled with its real render pose, the compositor rotates the older
; eye into line. Only very fast swings (and walking, below) drop depth now.
stereo_motion_hold_deg=20

; --- Motion hold: TRANSLATION (NEW) -----------------------------------------
; The gap that no ini value could close. The hold used to measure rotation
; only, so WALKING never triggered it: moving in a straight line changes no
; angle, and both eyes stayed a game frame apart for the entire walk. That is
; the "ghosting while moving the player character" half of the report, and
; unlike the turning case it cannot be fixed by pose tagging either -- the
; runtime's timewarp has no depth from us and cannot re-parallax a stale image.
;
; Game units of camera movement per frame. Above this, both eyes take the same
; newest frame. LOWER = holds mono more eagerly while walking.
; 0 disables the translation detector entirely (the old behaviour).
;
; 8 is a first guess and deliberately eager. If stereo drops out during tiny
; camera settling you cannot even feel, raise it. The Hold[] lines in
; mgs1_vr_test.log print the measured units/frame right next to this
; threshold, so one walk down a corridor makes this exact instead of guessed.
; RAISED from 8 to 20 for the same reason as the degrees threshold above --
; 8 units/frame is a slow walk, so the hold was on for the whole time you were
; moving. Read the actual measured units/frame from the Hold[] lines and set
; this just above a slow walk rather than at it.
stereo_motion_hold_units=20

; --- Eye tag shelf life (NEW -- fixes the cutscene regression) ---------------
; The left/right tag is advanced from the camera hook, which only runs while
; the GAME is running its own camera update. Cutscenes, codec calls and the
; pause menu all stop it -- and the tag then sat at whatever it last was, so
; every frame of the entire cutscene was routed into ONE eye while the other
; kept showing the last frame of gameplay from before it started.
;
; Past this many milliseconds without a refresh, a captured frame is treated as
; mono and goes to both eyes, which is the right answer for anything the camera
; update is not driving.
;
; 120 ms is about four game frames. Raise it if legitimate stereo drops to mono
; during heavy scenes; lower it if cutscenes still start in one eye.
stereo_eye_timeout_ms=120

; How many frames to stay in mono after the last fast movement, so it doesn't
; flick in and out at the threshold. ~10 frames = a third of a second.
stereo_hold_frames=10

; --- Frame-rate floor -------------------------------------------------------
; Alternate-eye stereo splits the game's frame rate between your eyes: 30 fps
; becomes 15 Hz each. That is the deal. But menus, codec calls and heavy scenes
; run much slower, and 9 fps would be 4.5 Hz per eye -- unusable, and probably
; a real part of why menus and cutscenes have felt so bad.
;
; Below this frame rate, stereo suspends itself and both eyes track the game
; normally. It resumes on its own when the frame rate recovers. The log says
; when it switches, so you can see whether a rough patch was this or the game.
; 0 disables the floor.
stereo_min_fps=24

; --- PLAYER HEADING ---------------------------------------------------------
; Found by disassembling mgsi.exe rather than by hunting in Cheat Engine.
;
; On entering first-person view the game runs, at mgsi.exe+53D86:
;     movswl 0x993fca,%eax    <- the camera yaw, the address we hook
;     add    $0x800,%eax      <- +180 degrees; the camera looks AT Snake
;     call   0x40ac17         <- a 2-instruction setter: mov [0x6c03a4],eax
;
; So 0x6C03A4 is the game's heading frame, and it is captured ONCE at the
; moment the view mode changes. That single fact explains both of the open
; complaints: movement locked to wherever the camera pointed when you entered
; FPV, and bullets going where Snake faces instead of where you look. The game
; kept using a heading from the instant you pressed the button while we moved
; the camera every frame afterwards.
;
; We now rewrite it every frame to match the camera we just wrote.
;
; THIS IS A HYPOTHESIS FROM READING THE BINARY, not something confirmed in
; play. If Snake spins on the spot, or movement goes strange, set this to 0 and
; describe what it did -- that tells us what the global really is.
write_player_heading=1

; The +180 the game itself uses. If aim ends up mirrored or 90 degrees off,
; this is the knob: 0, 1024, 2048 or 3072 (0/90/180/270 degrees).
player_heading_offset_units=2048


; ===========================================================================
; CUTSCENE VR -- first person during cutscenes (NEW 2026-08-22)
; ===========================================================================
; MGS1's cutscenes are the moments the game is remembered for, and up to now
; they have been the moments the mod does the least: the camera is entirely
; the director's, head tracking does nothing, and the eye tag expires so you
; get a flat mono picture. This makes you present inside the scene -- look
; around, lean, real stereo -- while the scene keeps its own framing, blocking
; and camera moves.
;
; READ THIS BEFORE TUNING ANYTHING BELOW. There is one structural unknown in
; the way, and this build is built to answer it rather than assume it.
;
; Both of the mod's camera writes live INSIDE the game's own camera-update
; routine. The handoff has recorded for over a week that "cutscenes, codec
; calls and the pause menu all stop the rotation hook" -- that is the entire
; reason stereo_eye_timeout_ms exists. But that was only ever OBSERVED for
; codec calls and menus. Nobody has measured it for real cutscenes. If the
; camera update does keep running through a cutscene, this feature works the
; good way. If it does not, no amount of configuration helps, because the code
; that would do the writing never executes.
;
; So there are two paths, and the log tells you which one is carrying:
;
;   PATH A -- IN-FRAME. The camera update is still running. Head rotation is
;     added on top of the scripted cutscene camera through the same confirmed
;     code path first person uses, with full 6DOF and real alternate-eye
;     stereo. Log line: "Cutscene VR: ENGAGED -- PATH A (in-frame)".
;
;   PATH B -- FLIP-TIME FALLBACK. The camera update has stopped. We write the
;     camera from the DirectDraw Flip hook instead -- the same game thread,
;     once per presented frame, one frame later. This is NOT the cross-thread
;     write this project banned years of sessions ago; same thread, different
;     point in the frame. It is MONO ONLY, deliberately: the stereo eye tag
;     cannot be advanced correctly at that point in the frame, and getting it
;     wrong routes an entire scene into one eye, which this project has
;     already shipped once. Log line: "Cutscene VR: ENGAGED via PATH B".
;
; WHAT TO CHECK IN THE LOG AFTER YOUR FIRST SESSION WITH THIS BUILD:
;
;   grep "Cutscene probe"   -- the three candidate state bytes, edge-logged
;                              with the FPV flag and whether the camera update
;                              is alive at that instant. This is the Cheat
;                              Engine hand-test the handoff has been asking
;                              for since 2026-08-15, run automatically. It
;                              happens even with cutscene_detect_mode=0.
;   grep "camera update"    -- STOPPED / resumed. The answer to the blocker.
;   grep "Cutscene VR"      -- detection verdicts and which path engaged.
;   grep "UNKNOWN VALUE"    -- a modal-byte value nobody has seen before. If
;                              one appears exactly when a cutscene starts,
;                              that is the clean cutscene flag and detection
;                              should switch to it.
;
; THE ONE KNOWN FALSE POSITIVE, AND WHY THIS SHIPS AT 0.
;
; Detection excludes modal UI using the confirmed mode enum at mgsi.exe+391A0C
; (0 gameplay, 1 pause menu, 4 inventory). Nobody has ever checked what a
; CODEC CALL reads. A codec call also stops the camera update -- that is one
; of the two cases the eye-tag expiry was originally observed on -- so if it
; reads 0, then in mode 1 or 3 a codec call is indistinguishable from a
; cutscene. The mod would drive the camera behind a 2D portrait screen and
; stop [openxr] ui_framing_enabled pushing it back. Symptom: codec portraits
; suddenly sit at gameplay distance.
;
; That is a coin-flip on a value nobody has measured, so this ships OFF -- and
; costs you nothing, because the probe runs at 0 as well. ONE SESSION SETTLES
; IT, and the follow-up needs a RELAUNCH, not a rebuild:
;
;   1. Play with cutscene_detect_mode=0. Trigger a codec call and sit through
;      one cutscene.
;   2. In mgs1_vr_debug.log, find the "Cutscene probe" lines at each.
;   3. Then:
;        codec modal != 0                  -> set cutscene_detect_mode=1.
;                                             Codec is excluded automatically
;                                             and auto is the best mode.
;        codec modal == 0, but the cutscene
;        control byte differs between them -> set cutscene_detect_mode=2 and
;                                             cutscene_control_mask to the bit
;                                             that moved.
;        codec modal == 0 and nothing else
;        separates them                    -> set cutscene_detect_mode=3 and
;                                             accept that codec calls come
;                                             along for the ride, or leave it
;                                             at 0 and say so -- that result
;                                             means we need a new signal, and
;                                             the decomp is the next place to
;                                             look, not another guess.
;
; Also check "camera update STOPPED" in the same log. If it never appears
; during a cutscene, path A works and this feature is essentially free. If it
; does appear, path B is carrying and cutscenes will be mono.

; 0 = OFF. The probe still reads and logs everything; nothing is written and
;     nothing about any other mode changes.
; 1 = AUTO (shipped). Cutscene = not first person, not modal UI, and either
;     the cutscene-control byte says so OR the camera update has stalled.
;     This is the one that actually delivers the feature.
; 2 = CONTROL BYTE ONLY. Trusts mgsi.exe+32279F & cutscene_control_mask.
;     Safest against the codec false positive, but only works if that byte
;     means what the community table implies.
; 3 = STALL ONLY. Anything that stops the camera update outside a modal menu.
; 4 = FORCE. Everything that is not first person and not modal UI, cutscene
;     or not. Diagnostic; this is third-person diorama with extra steps.
;
; Ships at 0 deliberately. Read the decision tree above before changing it --
; one session of normal play at 0 tells you which of 1, 2 or 3 is correct,
; and guessing between them is exactly the habit this project keeps paying
; for.
; SET TO 3 ON 2026-08-22 after the first probe session. Reasoning, from the
; log: the modal byte reads 1 for the pause menu and 4 for the inventory (both
; excluded automatically), and the camera update was seen STOPPING for every
; one of those plus room loads and screen wipes. Bit 0x80 of the cutscene
; control byte fired three times, and every one of them was a load or a screen
; wipe rather than a scene -- so mode 2 would be a false lead. That leaves the
; stall itself as the only signal we have evidence for. NOTE: no actual story
; cutscene was played in that session, so this is still the first real test,
; not a confirmed setting.
cutscene_detect_mode=3

; Which bit of mgsi.exe+32279F ("Cutscene control") to believe. The community
; table's author bound hotkeys writing 0x00 and 0x80 to this byte, so 0x80 is
; the presumed flag. Change it if the probe shows a different bit tracking
; scene boundaries.
cutscene_control_mask=128

; --- What head tracking is allowed to do during a scene ---------------------
; Head rotation on top of the director's camera.
cutscene_rotation=1

; How much of your head turn reaches the camera, as a percentage.
;
; 100 is shipped because it is the honest default to judge from, but consider
; dropping it. A cutscene is DIRECTED -- every shot is composed, and a 1:1
; turn walks the framing straight off whatever the scene wants you to be
; looking at. Somewhere around 40-60 keeps the director's framing dominant
; while still letting you look around inside the shot, which is probably what
; most people actually want. Costs nothing to try; ini-only.
cutscene_rotation_percent=100

; Positional 6DOF during scenes -- leaning, and real parallax. Only applies on
; path A; the fallback's position write is separate and off (see below).
cutscene_position=1

; Real alternate-eye stereo during scenes. PATH A ONLY. The fallback is always
; mono no matter what this says.
;
; Worth knowing before you judge it: cutscenes are exactly where the 15 Hz
; per eye cost is least noticeable, because the camera is usually still or
; moving slowly and the motion hold is not constantly firing.
cutscene_stereo=1

; Extend the fov_clip_distance write into cutscenes. OFF by default and this
; one is a real judgement call, not caution for its own sake: cutscenes are
; framed for a 53 degree lens, and widening it re-frames every single shot --
; characters shrink, the composition loosens, and you see more of the room
; the scene was never built to show. Try it, but expect it to be a matter of
; taste rather than an obvious win the way it was in first person.
cutscene_fov=0

; --- Shot cuts ---------------------------------------------------------------
; Same guard the third-person diorama uses, and it matters MORE here: MGS1
; cutscenes cut between shots constantly, and every cut is an instant
; viewpoint teleport. A single-frame camera jump larger than this many units
; is treated as a cut -- our writes are suppressed briefly and the head
; reference is re-pinned to the new shot, so the angle you happened to be
; looking at during the last shot is not dragged into the next one.
;
; 400 units is about 20 cm at the measured ~2048 units/metre.
cutscene_cut_units=400

; Frames to stay out of the way after a cut. Shorter than the third-person
; equivalent because cutscene shots are short and 12 frames of stock camera
; on a 60-frame shot is a fifth of it.
cutscene_cut_hold_frames=8

; --- The fallback -------------------------------------------------------------
; How many presented frames the camera update has to miss before we call it
; stalled and let the flip-time fallback take over. 6 frames is a fifth of a
; second at 30 fps -- long enough that a single hitch is not mistaken for a
; stall, short enough that you do not spend the opening of every scene frozen.
cutscene_stall_flips=6

; Master switch for path B. With this at 0, a cutscene that stops the camera
; update simply gets no VR camera at all -- which is exactly the behaviour
; before this feature existed, so it is a safe thing to turn off if the
; fallback misbehaves.
cutscene_flip_fallback=1

; Positional 6DOF THROUGH the fallback. OFF by default and this is a genuine
; correctness caveat rather than nerves. The in-frame position write is only
; correct because the rotation hook un-applies last frame's offset before the
; game's own interpolator (GV_NearExp4PV) reads it back -- that is what stopped
; leaning converging on 4x its intended distance. At flip time that ordering
; does not exist. During a real stall the interpolator is not running either,
; so the anchor scheme used here should be sound, but "should be" is an
; assumption, not a measurement. Turn it on once the rotation half is
; confirmed and watch for the camera drifting away during a long scene.
cutscene_flip_fallback_position=0

; How large a single-frame camera move has to be, in engine units, before the
; fallback calls it a cut to a new shot rather than a scripted pan. Below this
; the fallback tracks the pan exactly and adds your head on top; above it, the
; head reference is re-pinned.
;
; RAISED 32 -> 200 on 2026-08-23. 32 units is 2.8 degrees, which is inside the
; noise of a scripted pan: the session log has a re-pin firing on a 35-unit
; move, and every re-pin throws away however far you had turned your head. Real
; shot changes in the same log measured 74, 983, 1042 and 2112 units, so 200
; sits clear of the noise and well under every genuine cut.
cutscene_reanchor_units=200

; --- The camera-authority experiment ------------------------------------------
; Both of these are hypotheses from the community Cheat Engine table and
; NEITHER IS WRITTEN BY DEFAULT. Both are READ and edge-logged every session
; regardless of what you set here.
;
; mgsi.exe+593FD0 ("Camera control", 2 bytes, GM_SnakeCameraWork + 0x30). The
; table's author bound a hotkey that sets it to 1. If it is what its name
; suggests -- a switch handing camera authority over -- it would serve THREE
; separate goals at once: cutscene FPV, the third-person diorama fighting less,
; and retiring the old NOP patches entirely. It has been the highest-leverage
; unexplored item in the handoff for a week.
;
; -1 = observe only (shipped). 0 or above = write that value every frame while
; a cutscene is active, and restore whatever was there when the scene ends.
; Try 1 first, and read the "Cutscene probe: camera_control" lines before you
; do -- if the log says it changes every frame, it is not a mode switch and
; writing to it is a waste of a session.
cutscene_camera_control=-1

; mgsi.exe+32279F ("Cutscene control", byte). Same deal. The table's hotkeys
; wrote 0x00 and 0x80, so 0 and 128 are the two values worth trying.
; -1 = observe only (shipped).
cutscene_control_write=-1

; --- THE CUTSCENE PROBE (2026-08-23) ----------------------------------------
; The 2026-08-23 session settled half the cutscene question and opened the
; other half.
;
; WHAT IS KNOWN. The flip-time fallback's writes LAND. Every CsvFb line in
; mgs1_vr_test.log shows the value written coming back as the next frame's
; "live was", to the unit, across a sixty-second scene. Nothing overwrites
; them. And the picture did not move at all -- the report was "the game on a
; screen like normal", for every cutscene in the session.
;
; Writes landing plus a still picture leaves one conclusion available: during a
; cutscene, NOTHING READS rotate2. The likely mechanism is that the routine our
; hooks live inside (0xE1AF8) is not only the writer of rotate2 but also what
; turns it into the transform the rasteriser uses. Stop the routine and rotate2
; is still writable, still readable, and connected to nothing -- which is
; exactly consistent with PATH A working and PATH B not.
;
; That is a conclusion by elimination, so it gets measured.

; THE PULSE AND THE SCAN -- BOTH ANSWERED, BOTH NOW OFF.
;
; 2026-08-23. The pulse added 1024 units (90 degrees) of extra yaw to what the
; flip-time fallback wrote, switching on and off once a second. If rotate2 were
; read during a cutscene the camera would have swung a quarter turn and back,
; unmistakably. It did not. The writes landed perfectly -- the test log shows
; probe(yaw=1024) -> wrote(yaw=1024) -> the next frame reading it back -- and
; the scene played completely normally.
;
; So: during a cutscene, NOTHING READS rotate2. Disassembling mgsi.exe then
; explained why. rotate2 is layer 1 of three, and the copy that carries it
; forward only runs when the game is not playing a scripted camera. See
; view_commit_mode below, and claude/view_pipeline_map.md for the full map.
;
; Both are left in the build as instrumentation that can be switched back on,
; because they are how the question got settled and they are the control case
; if the view commit hook ever fails to install. Neither does anything now.
cutscene_probe_pulse_units=0
cutscene_probe_pulse_ms=1000
cutscene_probe_scan=0
; Decimal on purpose -- 5848576 is 0x593E00. Windows' ini reader is not
; reliably hex-aware, and a base that silently parsed as 0 would scan the
; module header and report nothing while looking like it worked.
cutscene_probe_scan_base=5848576
cutscene_probe_scan_bytes=1024
cutscene_probe_scan_every=4

; ===========================================================================
; VIEW COMMIT -- the layer 3 hook, and the one that reaches cutscenes
; ===========================================================================
; A third detour, at mgsi.exe+53C47, sitting on the last instruction before the
; game hands its camera to the view-matrix builder. Everything the mod wrote
; before this existed went into layer 1, which a cutscene disconnects.
;
;   LAYER 1  593FA0 pos / 593FC8 rot     <- the original two hooks
;      |  copied at +53D4B, but ONLY when [593FF9] & 3 == 0
;   LAYER 2  593FE0 pos / 593FF0 rot / 593FE8 target
;      |  committed at +54477
;   LAYER 3  593F60 FROM / 593F68 TO / 593F7C fov
;      |  consumed at +1C22, which builds the view matrix
;
; Layer 3 is a LOOK-AT PAIR, not an euler triple -- the direction is TO minus
; FROM. Whatever writes those two points owns the camera, unconditionally, in
; every game state.
;
; The hook is ADDITIVE on the game's own committed direction: it reads FROM and
; TO, measures where the shot is pointing, rotates that by how far your head
; has turned since the reference pose, and writes TO back. The director's
; framing is kept and you look around inside it. A shot change moves both
; points together, so it is followed with no re-anchoring heuristic at all --
; the thing cutscene_reanchor_units below had to approximate.
;
; WHAT THIS DOES NOT YET DO. It puts you INSIDE the shot the director chose. It
; does not move the camera to Snake's head -- that needs Snake's world position,
; which has not been located yet. Being in the scene with head tracking and
; stereo is a large step toward "the point of view of Snake"; it is not the same
; claim, and it is not being made.
;
;   0  observe only. Read layer 3 and log it every 60 frames, write nothing.
;      The honest first setting if anything below looks wrong.
;   1  drive during cutscenes only.  <-- DEFAULT
;   2  drive always. Takes the whole camera, gameplay included, away from the
;      layer 1 hooks. Not the default because those hooks carry a lot of
;      calibrated first-person behaviour that has not been re-proven here.
;
; At mode 1 or 2 the older cutscene paths (PATH A and the flip fallback) stand
; down automatically. Both would apply the same head delta at different layers
; and double every head movement. One writer per value per frame.
view_commit_mode=1

; Head rotation inside the shot. The percentage exists for the same reason
; cutscene_rotation_percent does: a cutscene is DIRECTED, and 1:1 head turning
; can walk the framing off whatever you are meant to be looking at. 100 ships
; because it is the honest default to judge from; try 60 if it feels like it
; fights the camera.
view_commit_rotation=1
view_commit_rotation_percent=100

; 6DOF. Leaning moves FROM and TO together, so the camera translates without
; changing where it points. Also requires position_tracking=1 above, and uses
; the same position_scale, max_position_offset and invert_position_* settings.
view_commit_position=1

; Alternate-eye stereo during cutscenes. The eye tag is normally advanced by
; the rotation hook, which does not run in a cutscene -- so when that has gone
; quiet this hook advances it instead. Without this, cutscenes would be mono
; for exactly the reason the old flip-time fallback always was.
; Requires stereo_alternate_eyes=1 above.
view_commit_stereo=1

; Write the field of view at the point of use (593F7C) as well as at the source
; (594000). Off by default -- the source write already propagates through
; +54477 in every state observed so far, and two writers for one value is what
; this whole session was about avoiding.
view_commit_fov=0

; Guards for degenerate shots. Between scenes FROM and TO can briefly coincide,
; which leaves no direction to rotate; below min_dist the hook falls back to the
; engine's own eye-to-target distance at 593FFC, then to default_dist.
view_commit_min_dist=256
view_commit_default_dist=1000

; ===========================================================================
; VIEW BUILD -- the chokepoint, and the fix for what view_commit_mode misses
; ===========================================================================
; 2026-08-23, second result, and it corrects the section above.
;
; The layer-3 hook at +53C47 is right about WHAT the renderer reads and wrong
; about WHEN it runs. During a cutscene MGS1 sets bit 7 of 32279F itself, and
; the FIRST instruction of the camera task is:
;
;     53BC2  test byte [32279F], 0x80
;     53BCA  jne  53C81            ; return, immediately
;
; so the entire task is skipped -- including the layer-3 commit and the +53C47
; site 133 bytes inside it. The session log proved it: across the 2m35s the mod
; detected as a cutscene, the +53C47 body ran about 60 times instead of about
; 4,500, and 32279F went to 0x80 five flips before the detection started and
; back to 0x00 on the flip it ended. That is the same bit the community cheat
; table's T hotkey sets by hand.
;
; So the game does not have one camera path. It has at least 26 -- that is how
; many call sites the view-matrix builder at +1C22 has -- and +53C47 is only
; the gameplay one. This hooks the function they all funnel into:
;
;     1C22  push ebp / mov ebp,esp / sub esp,0x30
;           args: view struct, FROM*, TO*, fov
;
; It gets whichever from/to pair the live path chose, and it runs whenever a 3D
; view is built, whatever the camera task is doing.
;
;   0  observe only -- log which paths run, write nothing.
;   1  drive during cutscenes only.  <-- DEFAULT
;   2  drive always.
;
; SAFE AGAINST DOUBLE-APPLICATION: +53C47 always runs before +1C22 inside one
; frame, so when the layer-3 hook has already rotated the pair, this one stands
; down for that call. One writer per value per frame, across two hooks in the
; same call chain.
view_build_mode=1

; WHAT TO READ IN THE LOG. Each distinct caller is named once:
;
;   View build: NEW camera path -- called from mgsi.exe+53C5C ...
;
; A caller RVA that appears ONLY while a cutscene is playing is the cutscene
; camera path. Once the log names it, put it here and this hook becomes
; surgical instead of driving every path. 0 = drive on any caller, which is
; correct until we know.
view_build_caller_rva=0
view_build_log_callers=24

; ===========================================================================
; THE CUTSCENE CAMERA -- mgsi.exe+1CD292
; ===========================================================================
; Third result of 2026-08-23, and the one that explains the two failures above.
;
; Sniper Wolf's death scene (Snowfield A2) is unambiguously an in-engine 3D
; cutscene, so something must build a view. It is not the camera task and it is
; not the view-matrix builder. Exactly ONE instruction in the binary sets bit 7
; of 32279F:
;
;     1CD0A2  or byte [32279F], 0x80
;
; and 1,058 bytes later, in the same subsystem:
;
;     1CD292  the function       (arg1 = camera script state, in ebx)
;     1CD4C4  writes 593F60/62/64 (FROM) and 593F68/6A/6C (TO) from [ebx+8..12]
;     1CD541  sqrt, 1CD54C atan2  -- derives the view angles INLINE
;     1CD56A  re-reads [ebx+8]    -- from the STRUCT, not the globals
;
; So during a cutscene the game switches its own camera task off, writes layer 3
; from script data, and computes the rotation itself, never calling +1C22. That
; is why the chokepoint hook logged exactly one caller across a 65-second scene.
;
; WE HOOK THE STRUCT, NOT THE GLOBALS, and that distinction is load-bearing: the
; angle maths at 1CD56A re-reads [ebx+8] rather than 593F60, so overwriting the
; globals after the copy would move the eye and leave the rotation pointing the
; old way. Rewriting the source at the top of the function keeps position,
; globals and derived rotation consistent.
;
;   0  observe only -- log whether it runs, write nothing.
;   1  drive during cutscenes only.  <-- DEFAULT
;   2  drive always.
;
; FIRST THING TO CHECK IN THE LOG: 'Cutscene camera: +1CD292 ran'. If those lines
; appear during a cutscene, this is the camera and it is ours. If they do NOT,
; then this subsystem is not what drives Sniper Wolf's death either, and the
; next move is instrumentation rather than another hook.
demo_camera_mode=1
demo_camera_log_lines=60

; --- SNAKE'S POINT OF VIEW IN CUTSCENES -------------------------------------
; The cutscene camera now works: the shot pans and cuts as directed and your
; head turns the view inside it. But it is still the DIRECTOR'S camera -- a
; tripod placed away from the actors. This puts the eye on Snake instead.
;
; WHERE SNAKE ACTUALLY LIVES (disassembly, 2026-08-24 -- not a scan):
;
;   +1E1701  push 0xA74 / push 5 / call 0x40A30C     allocate the player object
;   +E174B   mov ds:[0x734228], esi                  store the pointer
;   +DC89A   mov eax,[0x734228] / mov eax,[eax+0x9A8]   the game's own accessor
;
; So mgsi.exe+334228 is a POINTER to the player actor. Its fields map one-for-
; one onto the layer-1 camera globals this mod has written for weeks, because
; the first-person camera routine at +E1A67 builds them from this very object:
;
;   [obj+0x20] int16 x    ->  593FA0
;   [obj+0x24] int16 z    ->  593FA4
;   [obj+0x28] pitch/yaw  ->  593FC8
;   [obj+0x2C] roll       ->  593FCC
;
; THE EYE HEIGHT IS NOT [obj+0x22]. At +E1AB4 the game does
;
;   mov ecx,[esi+0x9C] / mov cx,[ecx+0x288] / mov [ebp-6],cx
;
; -- it copies the actor position and then REPLACES Y with a value read through
; the model pointer. That is Snake's head, and it is how MGS1 itself decides
; where first person is. Reading the same field means the eye height is correct
; standing, crouching and prone with no magic constant to tune.
;
; WHAT THIS CHANGES AND WHAT IT DOES NOT. Only the eye moves. Yaw, pitch and
; distance still come from the game's own (FROM -> TO) vector, so the scene is
; framed, panned and cut exactly as authored -- you are simply standing where
; Snake stands while it happens. Head tracking still applies on top. And R3
; double-press still drops the whole thing for the world-locked virtual screen,
; which remains the "watch it the way it was made" option.
;
; 0 = keep the director's camera (the 2026-08-23 behaviour)
; 1 = Snake's eyes                                            <-- DEFAULT
; TURNED OFF, deliberately, until there is a real position to drive it from.
; The task walk proved 00900F00 is in no object list and its "model pointer"
; changes every frame -- it is freed memory. Every pov=1 frame this feature has
; ever produced was driven from garbage, and those are exactly the shots you
; could not control with your head. With this at 0 the cutscene camera keeps
; the director's framing and your head moves it, on EVERY shot, with no
; flicker. That is the current best-behaving state, not the goal.
cutscene_snake_pov=0

; === SNAKE'S EYES: CUTSCENES FROM SNAKE'S POINT OF VIEW (2026-09-28) ========
; This REPLACES the cutscene_snake_pov experiment above (leave that at 0).
;
; Cutscene characters are not game objects -- that is why every earlier hunt
; for Snake came back empty. The demo system keeps its own cast: one
; DEMO_MODEL per character, posed every frame from the demo file (FoxdieTeam
; decomp kojo/demoexec.c, checked instruction-for-instruction against
; mgsi.exe +1CD292 FrameRunDemo and +1CECDA ShowScene). The cutscene hook has
; been holding a pointer to that cast since August. Snake is the model built
; from "snake" (or whatever outfit the player object was last wearing), and his
; head is joint 6 -- the same joint the game's own first-person view uses.
;
; What you get: the camera sits in Snake's head for the whole scene. No
; director cuts, pans or zooms. You start facing the way Snake faces; after that
; ONLY YOUR HEAD turns the view (nothing ever rotates you). If the scene moves
; Snake somewhere new, you are re-faced to his new heading. R3 hold recentres
; to his current facing. R3 double-press still switches to the flat virtual
; screen for the whole game, as before.
;
; cutscene_view:  0 = director's camera + head look (the old behaviour)
;                 1 = Snake's eyes                                  <-- DEFAULT
cutscene_view=1
; Shots that Snake is not in (Ocelot and Baker, the hangar, etc.):
;                 0 = director's camera + head look (3D, around you)
;                 1 = flat virtual screen in front of you
;                 2 = stay first person (2026-10-02 round 6)        <-- DEFAULT
;                     If Snake is in the scene but the director cut away from
;                     him (to whoever he is talking to), you stay behind his
;                     eyes where he stands. A scene he is not in at all, or a
;                     shot of somewhere else entirely, uses 0 (3D director
;                     camera with head look) -- never the flat screen.
cutscene_pov_no_snake=2
; Mode 2: stay behind his eyes only while the director's shot is looking at a
; point within this many game units (~mm) of where Snake stands.
cutscene_pov_hold_radius_units=9000
; How far in front of the head joint the eye sits, in game units (~mm). Stops
; you seeing the inside of Snake's face. Raise it if you see polygons of his
; head/bandana; lower it if you seem to float ahead of his body.
cutscene_pov_forward_units=100
; Use the mod's wide lens (fov_clip_distance) instead of the scene's own zooms.
; 1 = recommended: a zoom from inside someone's head is a lurch, and the headset
; projection is built for the mod's lens.
cutscene_pov_fov=1
cutscene_pov_stereo=1
cutscene_pov_position=1
; Snake jumping further than this between two frames = new location, re-face.
cutscene_pov_cut_units=1500
; Frames of "no Snake" before switching to the virtual screen (stops a one-frame
; hide flashing the screen up).
cutscene_pov_absent_frames=3
; Escape hatches, only if something is consistently off:
;   yaw_offset_deg -- if every scene STARTS you facing the wrong way (try 180)
;   invert_pitch   -- if looking up looks down
cutscene_pov_yaw_offset_deg=0
cutscene_pov_invert_pitch=0
; Head height above the model origin, used only until the head joint has been
; read (first frame of a scene).
cutscene_pov_fallback_head_units=700
; Extra Snake model names for outfits the auto-match misses, comma separated,
; names or hashes (e.g. sne_nude, 0x34C2). The debug log prints a "Demo model
; table" at the start of every cutscene listing each model's hash -- if a scene
; with Snake says "no Snake in this scene", his hash is in that table.
cutscene_pov_snake_models=
; Pov[] lines in mgs1_vr_test.log: every N demo frames, up to this many lines.
cutscene_pov_log_every=30
cutscene_pov_log_lines=120

; --- 2026-10-02: clipping and the black bars ---------------------------------
; Hide Snake's OWN cutscene model while you are in his eyes (renderer only --
; the scene itself is untouched). His head, shoulders and arms sit right on
; top of the camera and slice through whoever he is standing next to, which
; is most of the "characters clipping into each other" in close shots.
; 0 = keep him visible (you may see his arms when he gestures).
cutscene_pov_hide_snake=1
; The demo's cinematic black bars (top and bottom). 0 = removed while you
; watch through Snake's eyes (the flat virtual screen keeps them); 1 = kept.
; If you play with Captions ON and the text is hard to read without the bar
; behind it, set 1.
cutscene_pov_letterbox=0
; SUBTITLES (2026-10-02): in Snake's eyes the captions sit on the demo's
; bottom bar -- the very bottom edge of the lens, where they cannot be read.
; 1 = that strip is lifted onto its own panel just below your gaze whenever it
; has text on it, and painted out of the main view (the top bar still goes).
; 0 = old behaviour. Panel size / position: [subtitles] section.
cutscene_pov_subtitle_panel=1

; === SNAKE'S EYES IN GAMEPLAY (2026-10-02) ==================================
; Elevators, ladders and other set pieces take the camera out of first person
; (a third-person shot, or the elevator's fixed first-person camera that
; ignores your head). With this on, the view stays in Snake's head through
; them: built from his head joint every frame, turned by your head, world-
; locked like first person. It only engages while you are PLAYING (no
; cutscene, no menu) in VR mode; R3 double-press to the virtual screen still
; shows the game's own camera. Wall press and Nikita keep using the virtual
; screen as before.
gameplay_pov=1
; Eye in front of the head joint, game units (~mm).
gameplay_pov_forward_units=80
; 1 = the view turns with Snake (e.g. when he turns to face a ladder), like
; turning in first person. 0 = only your head turns it.
gameplay_pov_follow_body=1
; In a vehicle (the jeep's machine gun, 2026-10-02): the eye sits this far
; BEHIND and ABOVE Snake's head (game units ~mm), so the gun is out in front of
; you instead of in your face.
gameplay_pov_vehicle_back_units=250
gameplay_pov_vehicle_up_units=120
; RAPPEL (2026-10-04). On the rope Snake is a different object (rope.c), so
; Snake's eyes could not find him and the game's own camera came back. 1 =
; the view stays in his head on the rope and in the scripted shots around it;
; only your head turns it. The eye sits this far in front of his head (game
; units ~mm) -- small, because his face is close to the wall.
gameplay_pov_rope=1
gameplay_pov_rope_forward_units=40
; OCELOT'S TORTURE ROOM (2026-10-04). Strapped to the rack Snake is a
; different object again (chara\torture\torture.c; sne_03c.c in the cell), so
; Snake's eyes lost him and the game's camera showed the torture and the shots
; around it. 1 = view stays in his head there; only your head turns it.
; forward_units: eye in front of his head. yaw_offset_deg: added to the way
; his body faces when the view starts -- set 180 if you start facing backwards.
gameplay_pov_torture=1
gameplay_pov_torture_forward_units=80
gameplay_pov_torture_yaw_offset_deg=0
; Hide Snake's own body for the renderer, as first person does.
gameplay_pov_hide_body=1
; Use the mod's wide lens (fov_clip_distance) instead of the shot's own.
gameplay_pov_fov=1
gameplay_pov_position=1
; STICK IN SNAKE'S EYES (2026-10-02 round 6). Outside first person the game's
; stick is relative to ITS camera, not to where you look (on top of REX: "left/
; right on the right stick, up/down on the left"). This turns the left stick
; into your view: up = where you look, left/right = your left/right. Twin-stick
; turning is now off whenever Snake's eyes is drawing.
;   0 = off   1 = REX-top fight + wall press only (ladders and the jeep gun keep
;   the game's own stick)   <-- DEFAULT   2 = every Snake's-eyes moment
gameplay_pov_stick_follows_view=1
; RIGHT STICK TURNS (round 7): on top of REX the game has no first person at
; all, so the mod turns the view itself -- left stick moves where you look,
; right stick turns, like everywhere else. Speed: [input] pov_turn_deg_per_s.
;   0 = off   1 = in a vehicle: REX top and the jeep escape   <-- DEFAULT
;   2 = every Snake's-eyes moment
gameplay_pov_right_stick_turn=1
; REX top (round 8): while the left stick is idle Snake turns to face where you
; look, so punches land where you are looking -- like first person. 0 = off.
gameplay_pov_rex_face_view=1
; GpPov[] lines in mgs1_vr_test.log.
gameplay_pov_log_every=30
gameplay_pov_log_lines=300

; THE FIELD SWEEP -- answered, and now off by default.
;
; It asked the actor object which of ITS fields equalled 0x593FA0 (which in
; first person IS Snake's eye) and then read those offsets back during a
; cutscene. The answer came back clean: +0x020, +0x044 and +0xA60 -- three
; copies of one value, all written by the same camera routine, and +0xA60 read
; (0,0,0) on every cutscene frame. The actor carries no second position field.
; Set to 1 only to repeat that measurement.
;
; CORRECTION while we are here. The sweep was built on the claim that
; [actor+0x20] is a destination rather than a position. That claim is wrong.
; +E1A79 calls +40241F with (obj+0x20, obj+0x848); +40241F hands the same pair
; to +4022EC, which READS arg0 -- movsx eax,[ebx] / [ebx+2] / [ebx+4] -- as a
; world point to look up in a zone table, and WRITES arg1. +5CD367 calls that
; same function with the cutscene camera's own position as arg0. So +0x20 is a
; real position field, and the ~(150,550,-570) it reports during a cutscene is
; a real coordinate -- of something the scene is not filming.
snake_field_scan=0
snake_field_scan_lines=24
snake_field_scan_every=120

; THE ACTOR LIST WALK -- ask which OBJECT is Snake, not which field.
;
; The engine keeps every object in an intrusive doubly-linked list, and keeps
; the list heads in one table. Straight out of the allocator:
;
;   +1E1701   push 0xA74 / push 5 / call 0x40A30C     the player: class 5
;   0x40A30C -> 0x40B296 (malloc) -> 0x40A2AF (link)
;   0x40A2AF  imul eax,[class],0x44 / add eax,0x6BFC98
;             [head] = obj ; obj+0x4 = head ; obj+0x0 = old head
;
; So the head for class N is at 0x6BFC98 + N*0x44, +0x0 is next, +0x4 is prev,
; and class 5 is the game-object class -- 211 of the binary's 468 allocation
; sites use it. The whole cast can be walked from an address the engine
; computes itself, with nothing guessed and no pointer scanning.
;
; Actors[] lines in mgs1_vr_test.log list every node's [+0x20] position, its
; [+0x9A8] state word, and its distance to the shot's look-at target. If a node
; sits ON that target, that is the character the director is framing and Snake
; is one of the nodes beside it. If NO node is anywhere near it, then actors and
; camera are not in one coordinate space, and that -- not the choice of pointer
; -- is what has to be fixed.
; THE CLASS SCAN -- which of the sixteen lists is the cast?
;
; The first actor-list walk answered a question nobody asked. Class 5 has 21
; nodes and the captured player object (0x00900F00) is NOT one of them: the
; chain runs 00901B40, 008FF730, 008FF620 ... and never reaches it. Nor do its
; nodes look like characters -- an arithmetic run of (-16432,143,1),
; (-17744,143,1), (-19056,143,1) stepping -1312 with identical Y and Z, and a
; scatter of round numbers like (20250,1500,3000) and (13000,1500,-22250).
; That is map or zone furniture. Class 5 is a real object class; it is not the
; player's, and the class-5 allocation at +1E1701 that the 5 was read from
; belongs to something else.
;
; So stop picking a class. This walks all sixteen and reports which list
; contains the pointer the engine itself handed us at +E1B58. Watch for the
; Class[] line: "cap is in class N at index K". Then set actor_list_class=N.
; THE DEMO HEAP SWEEP -- the pointer hunt is over.
;
; The 2026-08-31 log settled it in one field: cap=00900F00 glob=00900F00 rej=2.
; The captured pointer and the +334228 global are the SAME address, and BOTH
; fail the liveness gate for essentially the whole scene (model=00000000,
; f895=00). There is no third pointer to try, because THE PLAYER OBJECT DOES
; NOT EXIST DURING THIS CUTSCENE. It is constructed afterwards -- 008FF400
; appears in the log only once the scene ends and first person resumes. The
; scene plays during a room transition; the demo animates its cast out of its
; own data, and the player we kept reaching for has not been built yet.
;
; So stop looking for Snake's object and look for Snake. The scene gives away
; one known answer for free every single frame: THE DIRECTOR IS LOOKING AT THE
; CHARACTERS. TO lands on or near one of them.
;
; This sweeps a window of the demo heap around the script chunk the +1CD292
; hook already holds (the 02C2xxxx pointer logged as state=) and reports every
; int16 (x,y,z) triple lying within the radius of TO, closest first. Demo[]
; lines in mgs1_vr_test.log.
;
; What to look for in the results:
;   * a hit at a STABLE OFFSET from chunk= that tracks the shot across cuts
;     -- that is a character's transform, and its offset is the field we want
;   * several such hits a few hundred units apart -- that is the cast
;   * no hits at all -- the demo keeps its actors somewhere else, and the
;     window or radius needs widening (try 1024 and 8000)
; RESULT, 2026-09-01: every hit came back d=0 -- dozens of EXACT copies of TO,
; at a 0x180 stride matching the per-frame camera records. The sweep found the
; camera's own look-at echoed through the script's interpolation buffers, and
; no character anywhere near it.
;
; It could not have found one. It read int16 triples only. On PSX the camera
; script stores SVECTOR (int16), which is exactly why TO matched to the unit --
; but an object's world translation lives in a MATRIX:
;
;     short m[3][3];   /* rotation, int16 */
;     long  t[3];      /* TRANSLATION, int32, at offset 0x14 */
;
; Characters were never going to show up in a 16-bit sweep. That was a format
; mistake on my side, not evidence that they are absent.
;
; So: both widths now (each hit is tagged /16 or /32), the d==0 echoes of TO
; skipped by default, and a 1 MB window instead of 256 KB -- the first run could
; only read 32-47 of its 64 blocks, so half the window was unmapped anyway.
;
; What to look for: a /32 hit a few hundred units from TO, at a STABLE OFFSET
; from chunk=, that tracks the shot across cuts. That is a character's
; translation, and the 0x14 before it is his rotation matrix.
; RESULT (2026-09-01 log): it did not pay out, and the reason it did not is
; worth keeping. NOT ONE /32 hit appeared anywhere in the run. Every hit was
; /16, and the /16 hits were of three kinds: exact echoes of TO (1 to 215 per
; dump), one or two identical values repeated at dozens of addresses across
; 02E33xxx-02E4xxxx, and ladders that step smoothly -- (1124,3073,-14172)d=3
; through (1140,3107,-14172)d=41. Those are camera-path buffers, interpolation
; between keyframes. Not bodies. And only 32-90 of the 256 blocks were
; readable, so most of the "search" never happened.
;
; Two lessons, and the second is the bigger one. A window centred on a pointer
; is a guess about where to look; VirtualQuery is a fact about it. And a
; coordinate search has to be told the answer before it can find it -- which is
; hopeless here, because Snake's cutscene position IS the unknown. The scan
; below stops looking for a number and starts looking for a shape.
;
; Set to 0 now. Turn it back on only to re-check a specific address.
demo_heap_scan=0
demo_heap_scan_every=60
demo_heap_scan_lines=24
demo_heap_scan_window_kb=1024
demo_heap_scan_radius=4000
demo_heap_scan_hits=10
demo_heap_scan_int32=1
demo_heap_scan_skip_exact=1

; --- transform_scan --------------------------------------------------------
; ASK THE RENDERER, NOT THE HEAP.
;
; The 2026-09-01 20:27 log settled what the demo is NOT doing. The task name
; walk worked perfectly -- 36 objects, 33 of them naming their own source file
; -- and during the whole cutscene the live cast was:
;
;   class 1  Kojo\demothrd.c   (008FFC40 -- the SAME pointer +1CD292 passes as
;                               its scene argument, which confirms both walks)
;   class 3  Takabe\cinema.c, Takabe\fog.c
;   class 4  Enemy\asioto.c, Enemy\asiato.c      (footsteps and footprints)
;   class 5  Enemy\demokage.c (demo shadow), walls, lamps, doors, snow, item
;   class 6  Anime\animconv\anime.c              (appears mid-scene, MOVES)
;
; Not one character task. No zako, no snake18, nothing from chara\ or animal\.
; And the demo's own cast list holds exactly ONE node, command 0x0E, position
; (0,0,0). So the characters in this scene are not game objects at all, and no
; amount of walking object lists will find them.
;
; It also disposes of 00900F00 for good: the task walk shows it is in NO list,
; and its "model pointer" changes every single frame (0689046C, 06730484,
; 073C0390, 062C05B4...). That is freed memory being churned by the allocator,
; not an object. Every pov=1 frame this build produced was driven from garbage.
;
; So stop asking memory where the characters are and ask the renderer.
; 0x407ADA(SVECTOR* translation, SVECTOR* rotation) is SetRotMatrix +
; SetTransMatrix: RotMatrix on arg1, then arg0's three shorts into the GTE's
; TRX/TRY/TRZ at 0x993E54. It has 424 call sites. It is the universal
; per-object transform, and nothing reaches the screen without it. If a
; character is visible, its translation went through this function on that
; frame -- whether or not any object, task or cast node exists for it.
;
; Each Xform[] line groups a frame's translations by CALLER RVA, and every RVA
; maps to a task whose source filename the binary still carries (see
; task_roster.md). So the output is not anonymous triples; it is "this code
; drew something here". A caller that appears only during the demo, with a
; translation that moves smoothly and sits near TO, is a character.
;
; This hooks a hot function. It does nothing unless a cutscene is running, and
; even then it is a 28-slot linear scan plus one guarded 6-byte read. If the
; frame rate drops, set transform_scan=0 -- nothing else depends on it.
; SECOND RUN -- what it found, and what it threw away.
;
; The translations are WORLD SPACE. Proved, not assumed: caller +C48C reported
; (-1500,0,24250), which is exactly the [+0x20] of the Thing\door.c task at
; 008FF3A0 in the very same log. Two independent readings of one door agreeing
; to the unit. Whatever this hook reports can be compared directly against
; FROM/TO and against the Task[] positions.
;
; The census during the cutscene:
;   +4ED96   ~120 calls/frame  -- the model draw. Its caller reads a per-object
;                                record: translation at +0, rotation at +8,
;                                copied on to +0x24/+0x28 and handed to
;                                0x5D8CCF. This is where the characters are.
;   +23E876  ~90 calls/frame   -- a particle lattice stepping (3000,-1200,-1500)
;                                per call. Snow (Thing\snow.c is alive).
;   +C48C / +C6A2  8 each      -- doors, hence the calibration above.
;
; AND THEN IT BINNED THE ANSWER. The first version kept one slot per caller and
; overwrote it every call, so out of +4ED96's 120 objects it reported number
; 120 and discarded the other 119. That is why the value settled to a constant
; (3732,1847,-16528) across shots with completely different framing -- it was
; whatever happened to be drawn last, a static prop. Snake went through that
; function on every one of those frames and the logger threw him away.
;
; So it now ranks by DISTANCE TO THE LOOK-AT POINT instead of by arrival order.
; The director is looking AT a character; the drawn object nearest TO is that
; character. Each Xform[] line lists the nearest objects, closest first, with
; the caller RVA still attached. A +4ED96 entry a few hundred units from TO,
; moving smoothly frame to frame, is a person.
; transform_scan: finished its job (found the demo cast); off to save frames in cutscenes
transform_scan=0
transform_scan_every=30
transform_scan_lines=40

; --- demo_cast_scan --------------------------------------------------------
; THE POINTER THIS MOD HAS BEEN HOLDING ALL ALONG.
;
; The +1CD292 hook captures stack[2] -- arg1, the script CHUNK -- and has
; called it "the state" since the day it was written. It never read arg0. And
; arg0 is the SCENE object, which is where the demo keeps its cast:
;
;   0x5CD292(scene, chunk):
;     [chunk+0x18] = count, [chunk+0x1C] = array of 0x34-byte script records
;     per record: find the node in the list at scene+0x38 whose [node+0x14]
;     matches record[0]; if there isn't one, malloc(0x78), zero it, link it,
;     and copy the whole 0x34-byte record into node+0x14. Mark the survivors,
;     free the rest, then run 0x5CEBD2 on each.
;
; Node layout, straight from that copy:
;   +0x00 prev   +0x04 next   +0x08 alive mark   +0x0C resource handle
;   +0x14 id     +0x18 command (1..0x4A)
;   +0x1C SVECTOR rotation    +0x22 SVECTOR position
;
; So every frame of every cutscene, the demo has been handing this mod a
; pointer to its own cast, and six builds went looking for that cast by
; sweeping the heap instead.
;
; Self-validating: commands must land in 1..0x4A (the jump table at 0x5CEA65
; has exactly that many entries) and positions must look like room
; coordinates. Cast[] lines in mgs1_vr_test.log. The node whose +0x22 tracks
; the character the camera is framing is the one Snake's POV should read.
; demo_cast_scan: finished its job (found the demo cast); off to save frames in cutscenes
demo_cast_scan=0
demo_cast_scan_every=30
demo_cast_scan_lines=60
demo_cast_scan_max=32

; --- task_name_scan --------------------------------------------------------
; THE SHIPPED BINARY STILL CARRIES ITS ORIGINAL SOURCE PATHS.
;
; Every object in this game is created by 0x40A30C(class, size) and registered
; by 0x40A347(obj, init, update, name), where `name` is a pointer to a string
; like "C:\mgs\source\chara\snake\sna_init.c". 477 registrations, 426 distinct
; files, all still in .rdata. So the object header is known exactly:
;
;   +0x00 next   +0x04 prev   +0x08 init fn   +0x0C update fn
;   +0x10 free fn   +0x14 NAME   +0x18 0   +0x1C 0
;
; and 0x40A2AF links each object at the front of the list headed at
; 0x6BFC98 + class*0x44.
;
; This walk is therefore SELF-VALIDATING, which nothing before it was. If the
; Task[] lines read back as source paths, the traversal is correct. If they
; read as garbage, it is wrong. There is no third case to argue about.
;
; IT ALSO EXPLAINS THE CLASS-5 DEAD END. Class 5 is the PLAYER's class. The
; characters a demo animates are class 4:
;   class 4  animal\zako10, zako11a, zako11e, zako11f, zako14, zako19, zako,
;            animal\meryl3, meryl72, animal\ninja, animal\liquid,
;            animal\snake18 (0x940), Okajima\11b_demo, Takabe\mg_demo1
;   class 5  chara\snake\sna_init.c (0xA74) = the player, plus scene props
;   class 6  Koba\demo\demomngr.c, Takabe\democame.c, chara\meryl07b
;   class 7  chara\others\intr_cam.c, chara\psyco\psyco.c
; I walked class 5 and concluded the cast did not exist. It was one list over.
;
; WHAT TO LOOK FOR: during the cutscene, which named tasks are alive. If a
; "snake18\snake18.c" or "sne*" task is present, that is the demo's Snake and
; its [+0x20] triple is the position this whole feature needs. If instead
; "snake\sna_init.c" is alive and moving, the player object was never freed and
; the pointer at 0x734228 was the wrong way to reach it.
; task_name_scan: finished its job (found the demo cast); off to save frames in cutscenes
task_name_scan=0
task_name_scan_every=240
task_name_scan_lines=8
task_name_scan_max=64
task_name_scan_class_mask=65535

; --- actor_signature_scan --------------------------------------------------
; SET TO 0. Superseded by task_name_scan above, which asks objects their names
; instead of inferring them from field shapes. Keep it as the fallback: if the
; class-list walk turns out to be wrong (no readable names), this scan finds
; actor-shaped memory without needing the lists at all.
;
; SEARCH FOR A SHAPE, NOT A NUMBER.
;
; Whatever animates Snake during a demo is an actor, and this binary's actors
; have a layout we know from the engine's own accessors, not from guessing:
;
;   +0x20   int16 x, y, z   world position   (+4022EC reads these three shorts
;                                             and hands them to the zone table)
;   +0x9C   model pointer                    (+E1AF8 reads the head through it)
;   +0x895  flags byte                       (+E1AA2 tests bit 3)
;   +0xA26  stance word                      (+E1AC5 tests it for 2)
;
; Four fields spread over 2.6 KB with independent constraints. That is
; selective enough to sweep with, and unlike a coordinate search it does not
; need to be told where Snake is first.
;
; Coverage is no longer luck either: VirtualQuery walks the address space and
; every committed, readable, non-image region is visited, up to the byte
; budget. The log line reports regions, KB actually swept, candidates tested
; and how many were object-shaped, so a disappointing result can be told apart
; from a scan that never ran.
;
; WHAT TO LOOK FOR in the Sig[] lines of mgs1_vr_test.log:
;   - a row that PERSISTS at the same address across dumps and whose position
;     MOVES: that is a live actor being animated
;   - several such rows a few metres apart: that is the cast
;   - the one the camera keeps nearest on shots that are obviously of Snake is
;     him; f= and st= should also look like a character (f=C7-ish, not 00)
; A row that never moves is scenery or a spawn record. Dozens of identical
; rows are a table, the same mistake the coordinate sweep made -- ignore them.
;
; If it finds nothing object-shaped at all: raise the budget, or set
; actor_signature_scan_radius very high (200000) once to see whether ANY
; actor-shaped block exists during the demo, anywhere. That distinguishes "the
; cast is elsewhere" from "the cast is not this shape".
actor_signature_scan=0
actor_signature_scan_every=60
actor_signature_scan_lines=24
actor_signature_scan_hits=12
actor_signature_scan_radius=24000
actor_signature_scan_budget_mb=96
actor_signature_scan_require_flags=0

class_list_scan=0
class_list_scan_every=60
class_list_scan_lines=20

actor_list_scan=0
actor_list_class=5
actor_list_every=60
actor_list_lines=30
actor_list_max=48

; WHERE SNAKE'S ACTOR POINTER COMES FROM.
;   0 = the global at mgsi.exe+334228
;   1 = captured from the engine's own register
;   2 = captured, then the global -- first LIVE one wins   <-- DEFAULT
;   4 = the global, then captured -- first LIVE one wins
;   3 = the object-list node nearest the shot's look-at target, falling back to
;       the captured pointer (needs actor_list_scan=1)

; ANSWERED 2026-08-26. The class scan walked all sixteen lists and reported
; "cap is in class -1" every time: the captured player object is in NONE of
; them. Counts were 0:1 1:5 2:1 3:2 4:2 5:21 6:0 ... about 35 objects in total
; -- far too few to be the game's cast. So 0x6BFC98 is a registry of something
; else entirely, and reading [node+0x20] as a position was meaningless for
; those nodes. Both scans are off by default now. Mode 3 goes with them: the
; nearest node was the same fixture (008FAC00) in every dump.
;
; What the same log DID show is why the picture flickered. For most of the
; cutscene the captured object reads model=00000000 and f895=00 -- cleared,
; not merely reused -- with occasional frames where it is rebuilt and reads
; f895=C7 again. The liveness gate correctly refused the dead frames, so the
; view alternated between Snake's eyes and the director's camera. That is the
; "flicker to a different area" exactly.
;
; Hence the new default, mode 2: captured first, then the global, and the
; first one that is actually LIVE wins. The global matters for a reason the
; capture cannot cover -- +E174B writes it when a player object is
; CONSTRUCTED, which happens during the scene, while the capture site is the
; first-person camera routine, which does not run then. Across a room change
; the capture is frozen on the previous room's player. This log shows exactly
; that: the new object 008FF400 only appeared once the scene ended and first
; person came back.
;
; Snake[] now prints cap= and glob= side by side every line, plus rej= (how
; many candidates the gate threw out). If glob= changes during the scene while
; cap= stays put, the global is the live pointer and mode 4 is the answer.
;
; Old note, kept: mode 3 is the one to try if the Actors[] lines show a node
; sitting on the look-at target. It cannot be worse than mode 1: with no walk and no candidate
; it is mode 1 exactly. It is also not a proof of identity -- the node nearest
; the target is whoever the director is pointing the lens at, which during a
; conversation is as likely to be the other character as Snake. It is there to
; get the eye INTO the scene so the next question can be asked from inside it.
;
; The 2026-08-24 build derived the actor from the global at +334228 -- the
; constructor at +1E1701 allocates an object and +E174B stores it there, and the
; game's own accessors at +DC89A read it back. That derivation was wrong, and
; its own probe is what proved it:
;
;   * distTO put the object 13000-17000 units from the shot's look-at target,
;     in a scene where the camera itself was ~17000 units from Snake. Actor and
;     camera were not in the same coordinate space at all.
;   * pos never travelled. Across a whole scene it oscillated inside a ~200-unit
;     box and came back -- noise, not walking.
;   * [obj+0x9C] read back as 0xF38A06C4, which is not a user-space pointer.
;     The head-height chain was reading whatever that value pointed at, which is
;     why eyeY kept being refused.
;
; So the pointer is no longer derived. The position detour already sits at
; +E1B58, inside the game's own first-person camera routine, where `esi` IS the
; actor the engine was handed -- ebx was set to esi+0x20 at +E1A74 and esi is
; callee-saved, so nothing has touched it. The detour publishes that register
; before any of the mod's gates, and the cutscene path reads it. That is not an
; inference about which global holds the player; it is the pointer the engine is
; using, at the moment it is using it.
;
; Default 1, captured only, on purpose. If nothing has been captured yet the POV
; simply does not engage and the cutscene plays on the director's camera, which
; is the behaviour that already worked. Falling back to a pointer already shown
; to be wrong would trade a known-good picture for a known-bad one.
;
; Watch for "Player actor CAPTURED: ..." in mgs1_vr_debug.log, and CAP vs GLOBAL
; on the Snake[] lines in mgs1_vr_test.log.
cutscene_snake_pov_actor_source=2

; Extra game units added to the eye Y AFTER the head-bone read. Y is DOWN, so a
; NEGATIVE value raises the camera. Leave at 0 unless the view sits visibly
; wrong inside the model -- the engine's own value should already be right.
cutscene_snake_pov_eye_offset=0

; Only used on frames BEFORE any head reading has been accepted -- the first
; frames after a load. Added to the actor's base Y, so negative raises it. 0
; means "use the feet position" -- deliberately obvious in the log rather than
; quietly plausible. Once one good reading arrives, the mod keeps that
; head-to-feet separation and this value is never consulted again.
cutscene_snake_pov_fallback_eye=0

; How far the head may sit from the feet, in game units, before the reading is
; refused. This is the guard that was missing from the 2026-08-23 build.
;
; WHY IT EXISTS. The head height lives at *(int16*)(*(void**)(obj+0x9C)+0x288),
; and the engine only reads it when bit 3 of [obj+0x895] is clear (+E1AA2). The
; first build read it unconditionally, so in every state where the engine itself
; declines -- which is most of a cutscene -- it got whatever that memory happened
; to hold: eyeY came back as +31108 and -25482 on consecutive probe lines, and
; the camera was thrown fifteen metres out of the room every time the shot
; changed. That is exactly the reported "glitches and displays different parts of
; the map".
;
; The engine's guard is now honoured, and this is the second line of defence: a
; head does not travel a room's width between frames, so anything outside this
; band is a stale or repurposed field, not a head. Rejected readings are logged
; as REJECTED and the last accepted separation is reused. Snake is about 1400
; units tall, so 3000 accepts every real posture with room to spare while still
; refusing anything absurd.
cutscene_snake_pov_eye_max_delta=3000

; Snake[] probe lines in mgs1_vr_test.log. These are the point of this build as
; much as the feature is: they print the object pointer, the position, the head
; height and the rotation every N cutscene frames, DRIVEN OR NOT.
;
; THE FIRST QUESTION THEY ANSWERED -- does the actor keep moving while the
; camera task is off? YES. The 2026-08-23 log shows pos drifting smoothly
; (194,523,-539) -> (167,540,-552) -> (80,608,-614) across a scene. Settled.
;
; THE QUESTION THEY ANSWER NOW is distTO: the distance from Snake to the shot's
; own look-at TARGET. If the director is framing Snake, that number lands in the
; hundreds and the actor coordinates and the camera coordinates are confirmed to
; be the same space. Tens of thousands would refute the whole actor derivation,
; and nothing downstream of it would be worth debugging.
;
; src= says where the eye height came from: model (read and accepted this frame),
; cal (reusing the last accepted separation), or seed (nothing accepted yet).
; f895 and stance are the engine's own two guard fields, printed raw.
cutscene_snake_pov_probe_lines=240
cutscene_snake_pov_probe_every=15

; --- THE SNAKE PROBE --------------------------------------------------------
; Someone will tell you 593FA0/A2/A4 is Snake's actor position and 593FC8/CA is
; his rotation. It is worth knowing exactly how much of that is true.
;
; WRONG on both counts as stated:
;   * 593FA0 is the base of GM_SnakeCameraWork -- 593FD0 is documented as that
;     struct + 0x30, and 593FD0 - 593FA0 is exactly 0x30. SnakeCAMERAWork. The
;     game lerps it toward a target at +4E1B39, and this mod has been pushing
;     half an IPD through it every frame for weeks without Snake twitching.
;   * 593FC8 is PITCH and 593FCA is YAW, not the other way round. The cheat
;     table's "ry"/"rx" labels are transposed; in-game isolation testing settled
;     this and it is recorded at 99% confidence.
;
; RIGHT in a way that matters. From the 2026-08-23 logs, 593FA0 is not the same
; thing in both view modes:
;
;   first person   593FA0 = (-4842,2998,-18470)   layer3 FROM = (-4841,2998,-18533)
;   third person   593FA0 = (-1111,1498,16762)    layer3 TO   = (-1111,1348,16762)
;
; In FPV it is the eye (matching FROM to within our own 63-unit IPD offset). In
; third person it is the camera's LOOK-AT TARGET -- X and Z identical to TO, Y
; off by 150 -- confirmed structurally by +45395A copying it into the
; third-person target at 593FA8 whenever [6BED20] > 0.
;
; A look-at target that tracks Snake IS Snake's world position, roughly 150
; units below his head, with no GM_PlayerPosition hunt. That one address blocks
; Snake's-POV cutscenes, third-person variant (b) and strafing all at once.
;
; The open question is whether it keeps tracking him during a CUTSCENE, when a
; scripted camera owns the framing. This probe answers it by measurement.
;
; WHERE TO LOOK: Snake?[] lines in mgs1_vr_test.log -- NOT the debug log. Each
; line prints 593FA0 next to the from/to pair that camera path just handed the
; renderer, plus the difference. Read the dFROM/dTO columns:
;
;   dFROM near zero          -> 593FA0 IS the eye. First person.
;   dTO near zero            -> 593FA0 is the look-at target, i.e. Snake.
;   both large and drifting  -> 593FA0 is neither, and during that scene it is
;                               tracking something of its own -- which in this
;                               struct is the interesting answer.
;
; Runs in every view mode and at view_build_mode=0, because it only reads.
view_build_snake_probe=1
view_build_snake_probe_every=30
view_build_snake_probe_lines=240

; View[] lines in mgs1_vr_test.log, one every 15 driven frames. They print the
; shot's direction in DEGREES, the head delta, what was written, and a same-frame
; read-back -- because "the memory changed" and "the picture changed" are
; different claims, and conflating them cost a whole session on 2026-08-23.
view_commit_log_frames=240

; --- Diagnostics ------------------------------------------------------------
; Rot[], Pos[] and Hold[] lines in mgs1_vr_test.log. Set to 0 to silence.
log_frames=240

[controls]
; ===========================================================================
; BUTTON MAPPING, BY ACTION NAME (rewritten 2026-09-29)
; ===========================================================================
; EASIEST WAY TO CHANGE IT: in the headset, HOLD the LEFT stick click (L3) for
; about a second. A panel opens on your left wrist listing every button and
; what it does.
;   - press the button you want to change (or stick up/down) to pick it
;   - stick left/right to change what it does
;   - click L3 to save (written back into this file) and close
; While the panel is open nothing reaches the game. A quick L3 tap (panel
; closed) still re-reads this file, as before.
;
; WHAT WAS WRONG BEFORE. This section used to hold joystick button numbers,
; and assumed 0=Weapon 1=First person 2=Crawl 3=Action. But what a joystick
; button does is decided by the GAME's own controller settings (saved in
; mgs.cfg), and yours are the classic PlayStation layout:
;   Crawl=0  Action=1  Weapon=2  First person=3  Items=6  Weapons=7
;   Select/Codec=8  Pause=9
; So "Action" (3) was really First person, the trigger (0) was Crawl, and the
; left trigger (2) was Weapon. Everything was shifted, not missing.
;
; NOW: name the ACTION. The mod reads the game's controller settings live
; (mgsi.exe+2571F4) and presses whichever joystick button the game gives that
; action -- so changing the game's own settings can no longer break this.
; Codec and Pause go out as Tab / Esc (proven). An action the game has not
; put on the pad goes out as its keyboard key. The log line
; "Game controller settings (mgs.cfg ...)" shows the table it read, and
; "Button first press: A -> ACTION -> joystick button 1" shows each route.
;
; Actions:  weapon  action  crawl  first_person  switch_item  items
;           switch_weapon  weapons  codec  pause  none
;           wall_press (the mod's own, see wall_press_mode in [input])
; (Old numbers are still understood, with the meaning this file used to
;  give them, and the log says how each one was read.)
;
; Other controls, not in this list:
;   Right stick click x2 (R3) ... VR <-> native virtual screen
;   Right stick click held ...... recentre
;   Left stick click (L3) ....... tap = reload this file, hold = remap panel
;   Grips (in first person) ..... wrist quick-select (see [wrist_hud])
;   Punching / chokehold ........ motion gestures, see [melee]
; ===========================================================================
right_trigger=weapon
right_grip=switch_weapon
a_button=action
b_button=first_person
x_button=wall_press
y_button=pause
left_trigger=crawl
left_grip=items
left_menu=codec

; Enter on A, Escape on B, for menus that don't take pad input (title screen,
; PC menus). Space is deliberately NOT sent -- Space is the game's Action key.
menu_keys_enabled=1

; 1 = an action the game has not put on a joystick button is sent as its
; keyboard key instead (Weapon=Ctrl, Action=Space, Crawl=Shift, First
; person=X, Switch item=Q, Items=A, Switch weapon=W, Weapons=S). 0 = joystick
; only. Codec (Tab) and Pause (Esc) are always sent as keys.
keyboard_synth_enabled=1

[melee]
; ===========================================================================
; FIGHTING WITH YOUR HANDS (2026-09-29). First person, VR mode only.
; The buttons still work too -- these are gestures ON TOP of them.
; ===========================================================================
; PUNCH: throw either hand forward, fast. Each punch presses Action once --
; the game's own punch, so keep punching for its punch-punch-kick combo.
punch=1
; How fast (cm/s, along the way you face) and how far out (cm from your head)
; a hand has to be. Raise the speed if waving your gun around punches; lower
; it if real punches are missed. The log names each punch it saw.
punch_speed_cms=200
punch_reach_cm=18

; CHOKEHOLD (unarmed -- wrist select NONE): bring both hands together in front
; of your chest, as if grabbing someone from behind. That holds Weapon, which
; is the game's grab. While holding, a sharp jerk of your hands presses Weapon
; again -- the game's squeeze; keep going to finish him.
chokehold=1
choke_hands_apart_cm=30
snap_speed_cms=150
; Hands must be held together, close to your chest and STILL, this long before
; the grab engages (so boxing with both fists up no longer grabs), and a punch
; cancels it.
choke_hold_ms=350

; Controller rumble when a punch, a grab, a squeeze or a wall press registers,
; so you can feel what the game was sent. (It cannot tell you whether the
; punch connected -- the game's own hit sound does that.)
rumble=1

[weapons]
; NIKITA: while a missile is in flight its camera is shown on the world-locked
; virtual screen (steer it with the stick as in the original). VR comes back
; by itself when the missile is gone. 0 = leave it in the VR view.
nikita_virtual_screen=1

[scope]
; ===========================================================================
; PSG1 RAISE TO EYE (2026-09-29). First person, VR mode only.
; ===========================================================================
; Hold the sniper rifle like any other gun: it is drawn in your hand and fires
; along the laser. Bring the controller up to your face and the scope is up:
;   - the view zooms, shown inside a round lens with a crosshair
;   - both eyes see one picture (a scope is one eye)
;   - you aim with your HEAD: the shot goes through the centre of the scope
;   - the rifle model and the laser are hidden so they do not block the lens
; Lower the controller and it is a gun in your hand again.
psg1_raise_to_eye=1
; The zoom, as the game's own clip distance (320 = its normal 53 deg lens).
; 1100 draws ~16 deg of the world.
zoom_clip_distance=1100
; How wide the scope picture appears in front of you, in degrees. Drawn angle
; vs shown angle is the magnification (1100 shown at 34 deg is about 2x).
; Bigger = more magnification and more of your view taken by the scope.
; 2026-10-02: 34 read as "a bit far away" -- 48 makes the scope picture larger
; in your view (and the magnification ~3x).
display_deg=48
; Scope comes up when you SIGHT DOWN THE RIFLE: your eye behind the controller,
; roughly on its barrel line, looking the way it points, and the controller
; within raise_distance_cm of your eye (down past lower_distance_cm). The first
; version only checked distance at 20 cm, which a shouldered rifle never
; reaches -- that is why nothing happened. With the PSG1 out, the debug log
; prints a "Scope check:" line every second with your own numbers, so these can
; be set from what your pose actually measures.
; 2026-10-02: your raised rifle measured 46-52 cm from the eye in the log, so
; 35 was never reached. Now 50 up / 62 down.
raise_distance_cm=50
lower_distance_cm=62


[input]
; --- Head-relative movement -------------------------------------------------
; Rotates the analog stick vector by your head-yaw offset before the game sees
; it, so Snake walks where you are looking instead of where the camera was
; pointing when you entered FPV. Pure input-space transform -- no memory
; writes, no new addresses. Automatically inactive outside FPV, so menus and
; third-person movement are untouched.
movement_follows_head=1
; LEFT-HANDED MODE (2026-10-05): 1 = the gun, laser and bullets follow your
; LEFT controller, the left trigger fires, A/B swap with X/Y, and the sticks
; swap (move on the right stick, turn on the left). Grips and the wrist panels
; stay on their own hands. Also in VR Settings (COMFORT tab), applies instantly.
left_handed=0

; --- WALL PRESS (2026-09-29, reworked the same day) ---------------------------
; MGS1 only flattens Snake against a wall in its own third-person view.
;   1 = HOLD THE RIGHT GRIP and move the left stick: the view goes to the game's
;       own camera on the virtual screen. Push toward the wall to flatten
;       against it and keep the stick held to sidle along it, exactly as in the
;       original. Let go of the grip and first person comes back. (A right-grip
;       press WITHOUT moving still opens the weapon list as before.)
;   2 = automatic: push into a wall in first person and it switches by itself
;       (the first version -- it fired once and then fought you).
;   0 = off.
wall_press_mode=3
; MODE 3 (DEFAULT, reworked 2026-10-02 round 7) -- back to a wall, shimmy:
;   * Stand with your back to a wall and HOLD X (x_button=wall_press; codec
;     stays on the left MENU button).
;   * The game leaves first person so it can do its real wall press, but you
;     STAY behind Snake's eyes, facing where you were looking. The mod keeps
;     pushing him into the wall for you, so he flattens against it.
;   * While X is held: RIGHT STICK left/right = shimmy left/right. That is the
;     right stick's only job while X is held; the left stick does nothing.
;   * Let go of X -> first person again.
; 0 = the wall is BEHIND you (back against it), 1 = the wall is in FRONT.
wall_press_wall_in_front=0
; CONFIRMED WORKING 2026-10-02: back to the wall, HOLD X, right stick left/right
; to shimmy, let go of X to step back into first person.
;
; CODEC GESTURE (round 10): squeeze the LEFT GRIP with your left hand held at
; your left ear -> Codec, like putting a radio to your ear. The left MENU
; button still opens the Codec too. codec_ear_cm = how close counts.
codec_ear_gesture=1
codec_ear_cm=17
; GRAB (2026-10-02): squeeze a grip while that hand is resting on a wall (the
; hands' own collision -- you feel it stop) and the game gets ACTION: climb a
; ladder, press an elevator button, by reaching out and grabbing. A grip in
; open air still opens the wrist list / wall press. 0 = off.
grab_action=1
grab_action_ms=120
; Mode 2 only:
wall_press_ms=450
wall_press_units=30
wall_press_release_ms=700

; If pushing forward sends you the wrong way around, flip this.
invert_movement_rotation=0
; Right-stick turning speed while Snake's eyes is drawing a fight the game
; has no first person for (Liquid on top of REX), degrees per second.
pov_turn_deg_per_s=150

; --- Twin-stick look --------------------------------------------------------
; 1 = in FPV, the RIGHT stick turns the view and the left stick only walks.
; 0 = old behaviour: the left stick both walks and turns.
;
; This applies ONLY in first-person view. Outside FPV the left stick keeps full
; 8-way movement, because there left/right is walking sideways, not turning --
; stealing it would leave Snake unable to move sideways at all.
;
; Note that turning and head-relative auto-turn drive the same game input
; (the left/right arrow keys), so while twin-stick is active in FPV the
; auto-turn from movement_follows_head is suspended. You are steering
; manually. It comes straight back the moment you leave FPV.
look_on_right_stick=1

; Flip if pushing the right stick right turns you left.
invert_look_stick=0

; 88 = X, the real in-game FPV binding (NOT V / 86).
native_fpv_toggle_vk=88
native_fpv_double_tap_ms=85

; Right-stick mouse-look fallback. Keep OFF for stable menu navigation.
fallback_mouse_look_enabled=0
fallback_mouse_look_sensitivity=16
fallback_mouse_look_deadzone_percent=20

; Legacy setting retained for compatibility
fallback_look_sensitivity=14

[motion_aim]
; ---------------------------------------------------------------------------
; MOTION AIM + GUN IN HAND (added 2026-09-22). First person only.
;
; Gun in hand: the game draws its OWN weapon model (SOCOM / FAMAS) at your right
; controller, and fires from it. Motion aim: if the gun is not showing, shots
; are still redirected to leave your hand along the laser.
;
; Self-calibrating. After loading into first person, look around for a few
; seconds -- left/right AND up/down -- until mgs1_vr_debug.log shows
; "CALIBRATED right_sign" and "CALIBRATED up_sign". The log prints the values;
; paste them into right_sign / up_sign below to skip this next launch.
; ---------------------------------------------------------------------------
enabled=1
; 1 = shots start at your hand, 0 = keep the game's muzzle, change direction only
muzzle_from_hand=1
; your hand is clamped this far from your head, so you can't reach through walls
max_reach_cm=60
; game units: how far from the eye a bullet can spawn and still be yours
player_radius=2500
; your shots only count if the right trigger was down in the last N ms (0 = off)
fire_window_ms=400
; 0 = auto-calibrate (see above)
; calibrated in your 2026-09-22 session (12 of 12 agreed on both)
right_sign=1
up_sign=1
; bullet flies along -column1 of its matrix (decomp okajima/bullet.c) -- leave these
forward_vector=1
forward_sign=-1
; 1 = aim at what is DRAWN under the laser (correct with submitted_hfov_deg=0)
display_mapping=1
log_shots=40
log_misses=6

; ---- gun in hand -----------------------------------------------------------
gun_in_hand=1
; 1 = every gun Snake fires: SOCOM, FAMAS/MP5, PSG1, Nikita, Stinger.
; 0 = SOCOM and FAMAS only.
gun_all_firearms=1
; STINGER: aimed with your HEAD, like a shoulder launcher's sight. The launch
; is rewritten to leave your right shoulder along where you are looking (the
; game's own aim turned out NOT to be your head). If the game has a lock-on
; target the missile still homes on it after ~0.5 s -- the log says whether it
; had one. No laser while the Stinger is out. 0 = the game's own aim.
stinger_head_aim=1
; Turn the gun about its barrel if it sits sideways or upside down: 0/90/180/270
gun_roll_deg=0
; Slide the model in your hand, in the gun's own axes (game units):
;   x = sideways, y = along the barrel (NEGATIVE = forward), z = up/down
gun_offset_x=0
gun_offset_y=0
gun_offset_z=0
; Removes the per-eye stereo nudge so the gun has real depth. If the gun looks
; doubled or swims sideways, try -1. 0 turns the correction off.
gun_eye_center_sign=1

; ---- throwables (grenade / stun / chaff) -----------------------------------
; 1 = throws leave your hand along the laser, keeping the game's lob
throw_aim=1
; 1 = show the grenade/canister in your hand while it is ready to throw
gun_throwables=1
; throw strength vs the game's own (25-300)
throw_speed_percent=100
; A real throwing motion sets direction and strength: release the trigger
; mid-swing. Slower than throw_swing_min_cms (cm/s) = a normal aimed throw.
throw_swing=1
throw_swing_min_cms=120
throw_swing_gain_percent=100

; ---- smoothness (REWORKED 2026-10-04) --------------------------------------
; The gun in your hand is drawn by the game ~30 times a second, from a reading
; of your controller taken a game frame or two before you see it. Two fixes:
;
; hand_filter: a One Euro filter on the controller pose the GUN and HANDS are
; drawn from (the aim laser keeps the raw pose). Strong smoothing
; while your hand is nearly still (kills tracking tremor), almost none while it
; moves. The old prediction extrapolated from the last two raw samples, which
; multiplied tracking noise ~5x -- that was the jitter.
hand_filter=1
; smoothing when still: lower = steadier but laggier (1.0-5.0)
hand_filter_min_cutoff_hz=1.5
; how fast smoothing backs off as you move (higher = less lag in motion)
hand_filter_pos_beta=12
hand_filter_rot_beta=2
; smoothing of the hand VELOCITY used for prediction
hand_filter_velocity_cutoff_hz=5
;
; hand_predict_ms: how far ahead to draw the hand. -1 = MEASURED: the mod times
; how old each game image is when it first reaches your eyes (debug log:
; "Hand smoothing: predicting N ms ahead"). Or set a fixed value, 0 = off.
hand_predict_ms=-1
; how much of the measured time to predict. 100 = all of it (tracks fast
; swings best, overshoots a little when you stop); lower = calmer.
hand_predict_percent=80
;
; STILLNESS (round 2): prediction fades out as your hand slows down, so a
; hand at rest is drawn exactly where the filter puts it, with no
; extrapolation of tracking noise. Below "still" nothing is predicted, above
; "moving" all of it is. Speeds in cm/s and degrees/s.
hand_still_cms=3
hand_moving_cms=15
hand_still_deg_per_s=9
hand_moving_deg_per_s=45
; HandJitter lines in mgs1_vr_debug.log while your hand is still: how much
; the controller, the filter output, the drawn gun and your head each moved
; per game frame. Tells us where any remaining shake comes from. 0 = off.
hand_jitter_log=1
; Logs the held weapon's 3D model layout once per weapon (groundwork for
; drawing it at headset refresh rate). Harmless; set 0 to silence.
model_probe=1
; CIGARETTES (2026-10-02 round 6): the cigarette is drawn from this frame's
; head while your eye is a frame behind, so at a run it sat ahead of your face.
; It is pulled back by this percent of one frame of Snake's movement.
; 0 = off; raise it if it still leads, lower/negative if it now trails.
; (LIFE drain is the game's own: 1 point every 64 frames, about 2 s -- slow.)
cigarette_lag_percent=100

; ---- hand relative to the RENDER pose (NEW 2026-09-22) ---------------------
; The gun and your shots used to be placed relative to the headset pose of the
; latest VR frame, while the game camera they are drawn into was steered from
; an older one. Every head movement in between moved the gun off your hand;
; tilting your head rolled it. 1 = place the hand relative to the head pose the
; game actually drew with (the same frame view record the world lock uses).
hand_relative_to_render_pose=1

[wrist_hud]
; WRIST HUD (2026-09-23). LIFE (and O2 when it is not full) plus the equipped
; item on your LEFT wrist, the equipped weapon on your RIGHT wrist, like a watch.
; Look at your wrist to see it (it appears when it is within gaze_cone_deg of
; where you are looking). While you HOLD a grip -- the game's own item / weapon
; selection is open -- that wrist shows a larger window onto the selection list.
;
; LIFE / O2 / names come from the game's own memory (mgsi.exe+38E7E0 block);
; the item and weapon boxes and the selection lists are cropped from the game
; image itself, so the icons and ammo counts are the real ones.
enabled=1
; Panel width in millimetres (the selection window is 1.6x this).
width_mm=90
; Where each panel sits relative to the controller grip, in centimetres:
; x (+ = right), y (+ = up, over the back of the hand), z (+ = back toward the elbow).
left_offset_cm=-1.0,4.0,10.0
right_offset_cm=1.0,4.0,10.0
; Tilt in degrees: pitch, yaw, roll. Pitch -60 = facing up and back toward you.
left_rotation_deg=-60,0,0
right_rotation_deg=-60,0,0
; Show a panel only when you look toward it (degrees off the centre of your
; view). 0 = always visible. Holding a grip always shows that wrist.
gaze_cone_deg=28
; MOUNT (2026-10-02): 1 = the BACK OF THE WRIST, like a watch -- turn your
; forearm palm-down to bring the back of the wrist toward your eyes and read
; it, instead of lifting the arm. 0 = the old spot over the back of the hand
; (uses left/right_offset_cm and left/right_rotation_deg above).
mount=1
; Per wrist (2026-10-02, round 5): where the INFO panel sits -- left = LIFE,
; radar, boss LIFE, item; right = weapon and ammo. 0 = top of the hand (uses
; left/right_offset_cm and left/right_rotation_deg above), 1 = back of the
; wrist, 2 = inside of the wrist (palm side -- turn the palm up to read it).
left_mount=0
right_mount=0
; Where the item (left grip) / weapon (right grip) LIST goes while you hold
; the grip to scroll it. Same numbers; 2 = inside of the wrist.
list_mount=2
inside_left_offset_cm=3.0,1.0,7.0
inside_right_offset_cm=-3.0,1.0,7.0
inside_left_rotation_deg=0,0,0
inside_right_rotation_deg=0,0,0
; Back-of-wrist position (cm, controller grip space: x + = right, y + = up the
; thumb side, z + = back toward the elbow) and a trim rotation (pitch, yaw,
; roll degrees). If the text reads upside down, set roll to 180; if it sits
; inside your sleeve, move z toward 10; if it floats off the arm, x toward 0.
; Round 3 (2026-10-02): closer to the hand (7 cm up the wrist, not 13) and
; tilted 45 deg toward the thumb side so it needs about half the twist. More
; tilt = less twist (try 60); 0 = straight out of the back of the wrist.
back_left_offset_cm=-3.0,1.0,7.0
back_right_offset_cm=3.0,1.0,7.0
back_left_rotation_deg=45,0,0
back_right_rotation_deg=45,0,0
; Hide the game's own item / weapon boxes in the bottom corners of your view
; (they are on your wrists now). 0 = keep them in the view as well.
hide_boxes_in_view=1
; Only used with select_on_wrist=0: also hide the game's selection strip in
; the view while its grip is held.
hide_selection_in_view=0
; Hide the game's own LIFE / O2 bars top-left of the view (they are on the
; left wrist). The rectangle follows your max LIFE; set life=x,y,w,h below to
; override it.
hide_life_in_view=1
; BOSS / MERYL LIFE (2026-09-25): every other life bar the game draws -- a
; boss's (OCELOT, SNIPER WOLF, VULCAN RAVEN, ...), Meryl's while she is with
; you -- also goes on the left wrist, under yours, with the game's own caption
; and colours. Taken from the game's one life-bar routine (mgsi.exe+68DA6), so
; it covers every fight without per-boss addresses. 0 = off.
show_boss_life=1
; LIFE BARS AT THE GAME'S OWN SIZE (2026-10-02): the game draws every life bar
; max/8 pixels long, so Snake's starts short and grows after each boss, and a
; boss's bar is as long as its own max. 1 = same on the wrist; 0 = always full
; width. Scale: panel pixels per game pixel, in percent (panel is 256 wide;
; at 125 a 1024 max -- Ocelot -- is 160 px).
life_bar_follows_max=1
life_bar_scale_percent=125
; And hide those bars in the view (they are on your wrist). 0 = leave them.
hide_boss_life_in_view=1
;life=0.031,0.025,0.450,0.150
; How hidden HUD areas are filled: 1 = continue the surrounding picture into
; the gap (no black squares), 0 = black.
hide_style=1
; 1 = the wrist panels show the game's real boxes (icons, ammo). 0 = plain text.
show_game_boxes=1
; Crop rectangles as fractions of the game image: x, y, width, height.
; From the decomp (item box at 16,184 and weapon box at 256,184 in 320x240,
; about 51x29 each). Nudge these if a box is cut off on your wrist.
item_box=0.030,0.755,0.180,0.140
weapon_box=0.780,0.755,0.180,0.140
; The game's own scrolling selection (item strip grows right/up from the item
; box, weapon strip left/up from the weapon box):
item_selection=0.030,0.420,0.530,0.480
weapon_selection=0.430,0.420,0.540,0.480

; RADAR under LIFE on the left wrist (cropped from the game's radar, top-right
; of the image: decomp clip 69x52 at 235,16 of 320x240, plus its frame).
show_radar=1
hide_radar_in_view=1
radar=0.722,0.050,0.244,0.258

; WRIST QUICK-SELECT. Hold a grip: a compact list opens on that wrist (left =
; items, right = weapons) instead of the game's full-screen selection. Flick
; that hand's stick up/down to scroll (hold to repeat), release the grip to
; equip. A quick tap without scrolling toggles, like the game (unequip / last
; one back). NONE is at the top of each list.
; 0 = grips open the game's own selection instead, cropped onto the wrist
; (experimental: the crop includes the scene behind it).
; ITEM USE (2026-10-02): with the ITEM list open (left grip held), press A to
; USE the highlighted item -- RATION, MEDICINE, DIAZEPAM -- exactly as ACTION
; does in the game's own item window (same routine, same rules: no effect at
; full LIFE, a frozen ration cannot be eaten). Releasing the grip afterwards
; leaves your equipped item as it was.
select_on_wrist=1


[render_twice]
; TRUE STEREO: the game draws BOTH eyes every game frame.
;
; Until now stereo alternated: left eye on one game frame, right eye on the
; next, so each eye refreshed at 15 Hz and depth had to be dropped whenever
; you moved (the motion hold). Render twice re-runs the game's own 3D sort and
; draw a second time per frame with the camera moved by one IPD. Each eye is
; presented with an extra Flip and read back off the primary (v2, 2026-09-24:
; v1 read the back buffer directly, which GOG's wrapper answers with a stale
; copy -- black headset AND black monitor). The monitor now flickers between
; eyes; that is expected. Eye separation comes from [camera_hook]
; stereo_ipd_mm / position_scale / stereo_swap_eyes.
;
; While it produces pairs, alternate-eye stereo and the motion hold stand down
; by themselves; if it stops, they resume within ~150 ms.
;
; 1 = on, 0 = off (hooks not even installed).
enabled=1
; When to draw both eyes (VR view mode only, never on the native screen):
;   1 = first person only (default -- title, menus and cutscenes untouched)
;   2 = any head-driven VR camera: first person, third-person VR, cutscene VR
;   3 = every 3D frame in VR mode
scope=1
; COMFORT: take the eye separation from the headset itself (the same eye
; poses the compositor presents with), so the depth scale matches your real
; IPD. 0 = use [camera_hook] stereo_ipd_mm instead. Out-of-range readings
; (outside 45-85 mm) always fall back to the ini value.
ipd_from_headset=1
; While both eyes are being drawn, skip the game's own Flip at the start of
; each frame -- it would only re-show the left eye on the monitor. Saves one
; present per frame. 0 = keep it.
skip_game_flip=1
; HOW EACH EYE IS CAPTURED (v6, 2026-09-25).
;   gpu  = copy each eye on the graphics card straight out of the render
;          target GOG's wrapper draws into -- no extra presents, up to
;          gpu_capture_height lines per eye instead of 480. The first frames
;          are checked against the flip path; if the pictures do not match
;          (or the wrapper turns out to draw on its own thread) the flip path
;          takes over for the rest of the session, by itself. Look for
;          "GPU check", "VERIFIED" or "GPU eye capture OFF" in the debug log.
;   flip = the previous method: present each eye with an extra Flip and read
;          it back off the screen (640x480, two extra presents per frame).
capture=gpu
; Per-eye height of the GPU copy (4:3, so 960 = 1280x960). Never upscales:
; a smaller game render target is copied at its own size.
gpu_capture_height=960
; deferred  = read the copies back at the end of the game frame, after the
;             game's logic, when the GPU has long finished (cheapest).
; immediate = read back straight after the second eye is drawn.
gpu_readback=deferred
; Once the GPU copy has been verified, ORDINARY frames (alternate-eye stereo,
; third person, cutscenes) are captured the same way instead of locking the
; screen. At 960p locking the screen cost 7-12 ms a frame and, under load, up
; to a whole second -- freezing both the game and the headset (2026-09-26
; log). 0 = keep locking the screen for those frames.
gpu_capture_all_frames=1
; One "RT PERF:" line every 5 s in mgs1_vr_debug.log.
log_perf=1
; FRAME-TIME GOVERNOR (v5, 2026-09-25). Comfort first: a steady 30 fps with
; alternate-eye stereo beats true stereo that stutters. The main test is
; whether the GAME is still on time: the game paces itself to 30 fps, so time
; the second eye spends inside that slack costs nothing (the 2026-09-24 test
; held 30.0 fps with zero drops at ~20 ms extra). If max_frame_skips game
; frames within one second are dropped or slower than late_frame_ms, render
; twice pauses and alternate-eye stereo takes over by itself. It retries after
; cooldown_ms; a relapse within 10 s doubles the pause, up to max_cooldown_ms.
; max_extra_ms is only a safety ceiling on the average cost (a single frame
; over 2.5x it also pauses). The first ~8 frames after entering first person
; are never judged on cost. Look for "Render twice: over budget" and
; "RT GOVERNOR:" in the debug log. max_extra_ms=0 turns the governor off.
late_frame_ms=40
max_frame_skips=3
max_extra_ms=24
cooldown_ms=3000
max_cooldown_ms=8000
; Late game frames only count against render twice while its own average cost
; is at least this many ms. Below it, a late frame is the game's own hiccup (a
; room load, effects) and true stereo carries on. On a fast card the second eye
; costs ~12 ms; on a slow one it can cost far more, and then this still bites.
late_frames_need_extra_ms=18

[hands]
; ===========================================================================
; SNAKE'S OWN HANDS + WALL TOUCH (2026-09-25). First person, VR mode only.
; ===========================================================================
; The game draws Snake's own gloved hands at your two controllers -- the same
; hand models it uses in third person, lit and textured by the game, with walls
; in front of them correctly. The right hand sits on the weapon grip (the gun
; has always hung from that hand's joint), the left hand follows your left
; controller.
;
; Needs [motion_aim] enabled=1 and its right_sign/up_sign calibrated (they are).
;
; WHAT TO LOOK FOR IN mgs1_vr_debug.log:
;   "Hands: render hook INSTALLED at mgsi.exe+6742"      the hook went in
;   "Hands: Snake body ... arm chains MATCH, hands armed"  it found his hands
;   "Hands: render reached Snake's body"                   they are being drawn
;   "Hands[N]: right ok (...) left ok (...)"               positions each frame
; If you ever see "renderer never reached Snake's body", it switched itself
; off for the session and put the body back to hidden -- send the log.
enabled=1

; The forearm, kept where the animation holds it relative to the hand. Off by
; default: a forearm that does not follow your real elbow can look odd. Try it.
show_forearms=0
; FULL BODY (EXPERIMENTAL, 2026-10-04): 1 = draw Snake's whole body with his
; arms reaching to your hands (head hidden). 0 = just the hands. Off by default
; while it is experimental. Also in the in-headset VR Settings (HANDS tab).
full_body=0

; Which of Snake's 16 body parts are the hands. Read from the game's own body
; (2 -> 3 -> 4 is the right arm, 7 -> 8 -> 9 the left). Only change these if
; the log says MISMATCH.
right_hand_part=4
right_forearm_part=3
left_hand_part=9
left_forearm_part=8

; Turning a hand in your grip, degrees: pitch, yaw, roll. The LEFT hand follows
; the controller's GRIP pose (the right follows the AIM pose so it matches the
; gun and laser), so it may want a pitch of -20 to -40 to sit naturally. If a
; hand is palm-up or backwards, try roll 180, then yaw 180.
right_rotation_deg=0,0,0
left_rotation_deg=0,0,0

; Sliding a hand in its own axes, game units (1000 = 1 m): x sideways,
; y along the hand (NEGATIVE = forward), z up/down.
right_offset=0,0,0
left_offset=0,0,0

; --- WALL TOUCH -------------------------------------------------------------
; Uses the game's own collision (the same test its bullets use to hit walls).
; A hand that would go into a wall or the floor stops on the surface instead.
wall_collision=1

; The gun too: if the barrel would poke through a wall, gun and hand slide
; back along it so the muzzle rests on the surface.
gun_collision=1

; How far short of the surface a hand stops (game units; 30 = 3 cm).
surface_margin=30

; Grip-to-muzzle length used for the gun check (game units). SOCOM's muzzle
; is ~370 from the grip; 420 leaves a little room.
gun_length=420

; --- KNOCK ------------------------------------------------------------------
; Rap a wall with either hand and it knocks: a sound at the spot you hit and
; the game's own noise event, which guards hear and come to investigate --
; the same event Snake's footsteps and his own wall knock raise.
knock=1

; How fast your hand has to be moving when it meets the wall, cm/s. Raise it
; if resting a hand on the wall knocks; lower it if a real rap does not.
knock_min_speed_cms=60
knock_cooldown_ms=300

; THE SOUND. -1 (default) = exactly what the game does when Snake knocks:
; the sound comes from the wall's MATERIAL, looked up in the current stage's
; own table, so a metal door and a concrete wall sound different, and surfaces
; the game refuses to knock on stay silent. Any other number forces that one
; sound id (decimal). -2 = the old probe that cycles candidate ids.
knock_sound_id=-1

; Loudness to guards. These are the game's own knock values (100 / 16), so a
; rap on the wall draws guards just like Snake's knock does. Lower them (e.g.
; 5 / 2) if you want the hands to be quieter than the real knock.
knock_noise_power=100
knock_noise_length=16

log_lines=40

[subtitles]
; Caption panel for cutscenes seen through Snake's eyes (2026-10-02).
; Where the captions are in the game picture (x, y, w, h as fractions of the
; frame): the demo's bottom bar, 184..224 of 240.
strip=0.0,0.7667,1.0,0.1667
; Panel width and distance (cm), and how far below your gaze (degrees).
panel_width_cm=80
panel_distance_cm=110
panel_down_deg=20
; Captions and codec text on the VIRTUAL SCREEN (2026-10-03). The PC port
; draws its text with Windows GDI after the 3D picture, so the captured
; picture never had it. 1 = the mod draws the game's text into the picture
; wherever the caption panel above is not showing it (virtual screen, codec,
; cutscenes on the 2D frame). 0 = off.
draw_on_screen=1

[vr_settings]
; IN-HEADSET VR SETTINGS (2026-10-05). Hold L3 (left stick click) about a
; second -- in gameplay, the pause menu or the title screen -- and a settings
; panel opens in front of you. Every option on it is a key in this file: it is
; read from here when the panel opens and written back here when you change it,
; so you rarely need to edit this file by hand.
;   Triggers = tab, stick up/down = pick, stick left/right or A = change,
;   Y = back to default, B or L3 click = close. Nothing reaches the game
;   while it is open.
; Most options apply a moment after you change them. Ones marked RESTART are
; saved and used the next time you launch the game.
; Where the panel floats: width, distance, and how far below eye height (cm).
panel_width_cm=90
panel_distance_cm=100
panel_below_eyes_cm=10

